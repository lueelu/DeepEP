l=\"#82539b\"/>\u003ctext class=\"node-title\" x=\"824\" y=\"662\" font-size=\"17\">\u003ctspan x=\"824\" dy=\"0\">可选训练组件与独立设备库\u003c/tspan>\u003c/text>\u003ctext class=\"node-subtitle\" x=\"824\" y=\"698\" font-size=\"13\">\u003ctspan x=\"824\" dy=\"0\">CATLASS 计算、SHMEM 通信\u003c/tspan>\u003c/text>\u003ctext x=\"1090\" y=\"748\" text-anchor=\"end\" font-size=\"10\" fill=\"#82539b\">o_build\u003c/text>\u003c/g>\u003c/svg>","mermaid":"flowchart TB\n  subgraph lane_api[\"公开接口\"]\n    o_contract[\"传入 token、路由与专家参数\"]\n    o_counts[\"计数与整数路由不求导\"]\n    o_gradients[\"autograd 对齐四类梯度\"]\n  end\n  subgraph lane_operator[\"融合训练算子\"]\n    o_experts[\"本 rank 持有本地专家参数\"]\n    o_forward[\"融合前向\"]\n    o_backward[\"融合反向\"]\n  end\n  subgraph lane_resource[\"运行资源与构建\"]\n    o_runtime[\"一个显式 SHMEM 资源所有者\"]\n    o_build[\"可选训练组件与独立设备库\"]\n  end\n  o_contract --> o_forward\n  o_experts --> o_forward\n  o_runtime --> o_forward\n  o_forward --> o_counts\n  o_forward --> o_backward\n  o_contract --> o_backward\n  o_backward --> o_gradients\n  o_build -.-> o_forward\n  o_build -.-> o_backward\n"},{"id":"01-modules","title":"模块关系与构建边界","layer":"L2","summary":"Python 协调 autograd，Host 分配与启动，Device 执行融合流程；Runtime 管理通信资源，构建依赖与运行调用分开表示。","lanes":[{"id":"python","label":"Python 接口","color":"python","x":46,"w":320},{"id":"host","label":"C++ Host / 绑定","color":"host","x":420,"w":320},{"id":"device","label":"AscendC Device","color":"cube","x":794,"w":320},{"id":"resource","label":"资源与构建","color":"memory","x":1168,"w":320}],"nodes":[{"id":"m_python","lane":"python","step":0,"title":"公开 Module 与 autograd","subtitle":"Module / Function 分工","symbol":"MegaMoeBF16Train","description":["MegaMoeBF16Train 继承 nn.Module，管理通信窗口、执行器和参数检查。调用 op(...) 时，PyTorch 先进入这个 Module 的 forward，再由它调用 _MegaMoeBF16TrainFunction.apply(...)。","_MegaMoeBF16TrainFunction 继承 autograd.Function，分别定义前向和反向如何调用自定义 kernel。启用梯度且有浮点输入需要求导时，apply 把这个 Function 记录为计算图节点，并将输出 y 与该节点关联。","训练代码执行 loss.backward() 后，autograd 沿计算图传回 grad_y，并调度 Function.backward。反向接口由 Function 提供，Module 负责公开调用和资源管理。"],"reads":["Tensor 输入、保存模式、EP group"],"writes":["autograd 节点、y/counts"],"waits":[],"sources":[{"path":"experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py","anchor":"class MegaMoeBF16Train(torch.nn.Module):","occurrence":1,"line":82,"start":80,"end":97,"sha256":"86bb936a2721c1323df007efd97b83c50798295113edee5c02c1a11d1cc3a232","url":"https://github.com/xixing-321/DeepEP/blob/0b5f385fd404a09446d317235d5e31c01471ed94/experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py#L82","excerpt":[{"line":80,"text":""},{"line":81,"text":""},{"line":82,"text":"class MegaMoeBF16Train(torch.nn.Module):"},{"line":83,"text":"    \"\"\"Fused Ascend950 BF16 forward/backward, derived from source b8cff148."},{"line":84,"text":""},{"line":85,"text":"    Select the NPU before construction. Pass an existing EP ProcessGroup or"},{"line":86,"text":"    StoreGroup. All ranks construct and close in the same order; DEEPEP_SHMEM_ENDPOINT names a separate bootstrap endpoint."},{"line":87,"text":"    This instance owns the root Session's symmetric window. There is one SHMEM"},{"line":88,"text":"    owner per process, shared with DeepEP's exclusion checks."},{"line":89,"text":""},{"line":90,"text":"    Calls use the construction stream and must be serialized in identical rank"},{"line":91,"text":"    order. Separate forwards retain separate saved tensors. Close only after"},{"line":92,"text":"    backward (or discard unused graphs). Higher-order derivatives, concurrent"},{"line":93,"text":"    streams, and simultaneous inference/communication owners are unsupported."},{"line":94,"text":"    \"\"\""},{"line":95,"text":""},{"line":96,"text":"    def __init__(self, ep_group, local_mem_size, *, timeout=120, debug_collectives=False):"},{"line":97,"text":"        super().__init__()"}]},{"path":"experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py","anchor":"class _MegaMoeBF16TrainFunction(torch.autograd.Function):","occurrence":1,"line":48,"start":46,"end":77,"sha256":"86bb936a2721c1323df007efd97b83c50798295113edee5c02c1a11d1cc3a232","url":"https://github.com/xixing-321/DeepEP/blob/0b5f385fd404a09446d317235d5e31c01471ed94/experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py#L48","excerpt":[{"line":46,"text":""},{"line":47,"text":""},{"line":48,"text":"class _MegaMoeBF16TrainFunction(torch.autograd.Function):"},{"line":49,"text":"    @staticmethod"},{"line":50,"text":"    def forward(ctx, op, x, ids, weights, w1, w2, max_recv, limit, mode):"},{"line":51,"text":"        op._check_ready()"},{"line":52,"text":"        op._runtime.validate_topk_weight_type(weights.dtype, 0)"},{"line":53,"text":"        result = op._executor.forward(x, ids, weights, w1, w2, max_recv, limit, mode)"},{"line":54,"text":"        ctx.op = op"},{"line":55,"text":"        ctx.max_recv, ctx.limit, ctx.mode = max_recv, limit, mode"},{"line":56,"text":"        ctx.save_for_backward(weights, w1, w2, result.counts, result.saved_state, result.dispatch_output)"},{"line":57,"text":"        ctx.mark_non_differentiable(result.counts)"},{"line":58,"text":"        return result.y, result.counts"},{"line":59,"text":""},{"line":60,"text":"    @staticmethod"},{"line":61,"text":"    @once_differentiable"},{"line":62,"text":"    def backward(ctx, grad_y, grad_counts=None):"},{"line":63,"text":"        weights, w1, w2, counts, saved, dispatch = ctx.saved_tensors"},{"line":64,"text":"        op = ctx.op"},{"line":65,"text":"        op._check_ready()"},{"line":66,"text":"        op._runtime.validate_topk_weight_type(weights.dtype, 1)"},{"line":67,"text":"        result = op._executor.backward("},{"line":68,"text":"            grad_y.contiguous(),"},{"line":69,"text":"            weights,"},{"line":70,"text":"            w1,"},{"line":71,"text":"            w2,"},{"line":72,"text":"            counts,"},{"line":73,"text":"            saved,"},{"line":74,"text":"            dispatch,"},{"line":75,"text":"            ctx.max_recv,"},{"line":76,"text":"            ctx.limit,"},{"line":77,"text":"            ctx.mode,"}]},{"path":"experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py","anchor":"        return _MegaMoeBF16TrainFunction.apply(","occurrence":1,"line":146,"start":145,"end":148,"sha256":"86bb936a2721c1323df007efd97b83c50798295113edee5c02c1a11d1cc3a232","url":"https://github.com/xixing-321/DeepEP/blob/0b5f385fd404a09446d317235d5e31c01471ed94/experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py#L146","excerpt":[{"line":145,"text":"            raise ValueError(\"save_gmm1_output must be bf16, none, mxfp8 or auto\")"},{"line":146,"text":"        return _MegaMoeBF16TrainFunction.apply("},{"line":147,"text":"            self, x, topk_ids, topk_weights, w1, w2, max_recv_tokens, limit, save_gmm1_output"},{"line":148,"text":"        )"}]}],"formula":"op(...) → MegaMoeBF16Train.forward\n        → Function.apply → Function.forward\n        → op._executor.forward → 前向 kernel\n\nloss.backward() → autograd 引擎传回 grad_y\n                → Function.backward\n                → op._executor.backward → 反向 kernel","ordinal":1,"x":58,"y":112,"w":296,"h":124,"color":"python"},{"id":"m_runtime","lane":"resource","step":0,"title":"根 Runtime 管理所有权","subtitle":"deep_ep/_runtime.py","symbol":"Runtime / _TrainRuntime","description":["训练包装类选择根 Runtime 的训练工厂，检查各 rank 的配置和设备身份，并参与进程级 SHMEM 所有者互斥。它与 Host BF16Executor 的计算职责分离。"],"reads":["EP rank/world、窗口容量、endpoint"],"writes":["Runtime.native、进程所有者记录"],"waits":["EP 配置交换"],"sources":[{"path":"deep_ep/_runtime.py","anchor":"        if self._megamoe_train:","occurrence":1,"line":137,"start":135,"end":146,"sha256":"fb7faae2de88655b03c816cb9610f82b4a7a8f2739367c335c2a90dcf7048c00","url":"https://github.com/xixing-321/DeepEP/blob/0b5f385fd404a09446d317235d5e31c01471ed94/deep_ep/_runtime.py#L137","excerpt":[{"line":135,"text":"            rank, size = rank_and_world(group, rank, world_size)"},{"line":136,"text":"        factory = native.Runtime"},{"line":137,"text":"        if self._megamoe_train:"},{"line":138,"text":"            integer(\"world_size\", size, 2, 1024)"},{"line":139,"text":"            factory = getattr(native, \"create_megamoe_train_runtime\", None)"},{"line":140,"text":"            if factory is None:"},{"line":141,"text":"                raise RuntimeError(\"Rebuild with DEEPEP_BUILD_MEGAMOE_TRAIN=ON\")"},{"line":142,"text":"        elif self._megamoe:"},{"line":143,"text":"            integer(\"world_size\", size, 2, 128)"},{"line":144,"text":"            factory = getattr(native, \"create_megamoe_runtime\", None)"},{"line":145,"text":"            if factory is None:"},{"line":146,"text":"                raise RuntimeError(\"Rebuild with DEEPEP_BUILD_MEGAMOE=ON\")"}]}],"ordinal":2,"x":1180,"y":112,"w":296,"h":124,"color":"memory"},{"id":"m_binding","lane":"host","step":1,"title":"训练扩展注册对象","subtitle":"csrc/bindings.cpp","symbol":"PYBIND11_MODULE(_C, module)","description":["训练包自己的 _C 注册 BF16Executor 的构造、forward/backward/close，并把 ForwardResult、BackwardResult 字段映射给 Python。它与根 deep_ep._C 是两个用途不同的扩展。"],"reads":["Host 类型与方法声明"],"writes":["_C.BF16、结果类型绑定"],"waits":[],"sources":[{"path":"experiments/megamoe_train/csrc/bindings.cpp","anchor":"PYBIND11_MODULE(_C, module)","occurrence":1,"line":8,"start":6,"end":26,"sha256":"162ffa6a61d1c0aa6fb7f451a31bdb44de80747b1fe2581d4e06b106f36880a7","url":"https://github.com/xixing-321/DeepEP/blob/0b5f385fd404a09446d317235d5e31c01471ed94/experiments/megamoe_train/csrc/bindings.cpp#L8","excerpt":[{"line":6,"text":""},{"line":7,"text":"namespace py = pybind11;"},{"line":8,"text":"PYBIND11_MODULE(_C, module)"},{"line":9,"text":"{"},{"line":10,"text":"    using deepep::megamoe_train::BF16Executor;"},{"line":11,"text":"    namespace ops = deepep::megamoe_train::ops;"},{"line":12,"text":"    py::class_\u003cops::ForwardResult>(module, \"ForwardResult\")"},{"line":13,"text":"        .def_r xt":"}"},{"line":42,"text":""},{"line":43,"text":"void InitializeMegaMoeBF16Context(torch::Tensor context, void* symmetric_buffer, int rank, int world_size)"},{"line":44,"text":"{"},{"line":45,"text":"    TORCH_CHECK(symmetric_buffer != nullptr, \"symmetric_buffer must not be null\");"},{"line":46,"text":"    const std::size_t context_bytes = static_cast\u003cstd::size_t>(context.numel()) * context.element_size();"},{"line":47,"text":"    TORCH_CHECK(context_bytes >= sizeof(MegaMoeContext), \"MegaMoe BF16 context tensor is too small\");"},{"line":48,"text":"    TORCH_CHECK(world_size \u003c= 1024, \"MegaMoe BF16 supports at most 1024 EP ranks\");"},{"line":49,"text":"    MegaMoeContext host_context{};"},{"line":50,"text":"    host_context.ep_rank_id = static_cast\u003cuint32_t>(rank);"},{"line":51,"text":"    host_context.rank_size_per_server = static_cast\u003cuint32_t>(world_size);"},{"line":52,"text":"    for (int peer = 0; peer \u003c world_size; ++peer) {"},{"line":53,"text":"        void* peer_ptr = aclshmem_ptr(symmetric_buffer, peer);"},{"line":54,"text":"        TORCH_CHECK(peer_ptr != nullptr, \"aclshmem_ptr failed for MegaMoe BF16 peer rank \", peer);"},{"line":55,"text":"        host_context.ep_buffer[peer] = reinterpret_cast\u003cuint64_t>(peer_ptr);"},{"line":56,"text":"    }"},{"line":57,"text":"    const auto copy_status ="},{"line":58,"text":"        aclrtMemcpy(context.data_ptr(), context_bytes, &host_context, sizeof(host_context), ACL_MEMCPY_HOST_TO_DEVICE);"},{"line":59,"text":"    TORCH_CHECK(copy_status == ACL_SUCCESS, \"failed to initialize MegaMoe BF16 communication context, acl error \","},{"line":60,"text":"                copy_status);"},{"line":61,"text":"}"}]}],"ordinal":3,"x":806,"y":460,"w":296,"h":124,"color":"host"},{"id":"lc_forward","lane":"python","step":3,"title":"提交一次前向","subtitle":"返回 y/counts 与内部持久状态","symbol":"_MegaMoeBF16TrainFunction.forward","description":["自定义 Function 调用执行器前向。设备写入 Y、counts、saved_state、dispatch_output；前向函 --> lc_owner\n  lc_owner --> lc_context\n  lc_context --> lc_forward\n  lc_forward --> lc_saved\n  lc_forward --> lc_scratch\n  lc_saved --> lc_backward\n  lc_backward --> lc_drain\n  lc_drain -.-> lc_release\n  lc_release --> lc_closed\n"},{"id":"03-forward-call","title":"一次前向的跨文件调用","layer":"L4","summary":"从Module调用逐层走到MIX设备入口，再沿保存结果返回autograd；箭头表达调用或数据关系，stage坐标不代表实测耗时。","lanes":[{"id":"python","label":"Python / autograd","color":"python","x":46,"w":320},{"id":"host","label":"绑定 / Host","color":"host","x":420,"w":320},{"id":"memory","label":"Tensor 资源","color":"memory","x":794,"w":320},{"id":"device","label":"AscendC 设备","color":"cube","x":1168,"w":320}],"nodes":[{"id":"fc_public","lane":"python","step":0,"title":"公开 forward 进入 autograd","subtitle":"Module → Function.apply","symbol":"MegaMoeBF16Train.forward","description":["调用 op(...) 时，nn.Module 的调用机制进入 MegaMoeBF16Train.forward。它校验 max_recv_tokens、clipping limit 与保存模式，再调用 _MegaMoeBF16TrainFunction.apply(self, x, IDs, p, W1, W2, ...)。","启用梯度且有浮点输入需要求导时，apply 建立自定义 autograd 节点并执行 Function.forward。PyTorch 因此知道后续反传应调用哪个 Function.backward。","这里的 save_gmm1_output 默认 bf16；本图选择 canonical 权重、H7168、F3072 和关闭 clipping。"],"reads":["X、IDs、p、W1、W2、max_recv_tokens"],"writes":["自定义autograd调用"],"waits":[],"sources":[{"path":"experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py","anchor":"        return _MegaMoeBF16TrainFunction.apply(","occurrence":1,"line":146,"start":139,"end":149,"sha256":"86bb936a2721c1323df007efd97b83c50798295113edee5c02c1a11d1cc3a232","url":"https://github.com/xixing-321/DeepEP/blob/0b5f385fd404a09446d317235d5e31c01471ed94/experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py#L146","excerpt":[{"line":139,"text":"        \"\"\""},{"line":140,"text":"        integer(\"max_recv_tokens\", max_recv_tokens, 1, (1 \u003c\u003c 31) - 1)"},{"line":141,"text":"        limit = float(swiglu_limit)"},{"line":142,"text":"        if not math.isfinite(limit) or not math.isfinite(c_float(limit).value):"},{"line":143,"text":"            raise ValueError(\"swiglu_limit must be finite and representable as float32\")"},{"line":144,"text":"        if save_gmm1_output not in (\"bf16\", \"none\", \"mxfp8\", \"auto\"):"},{"line":145,"text":"            raise ValueError(\"save_gmm1_output must be bf16, none, mxfp8 or auto\")"},{"line":146,"text":"        return _MegaMoeBF16TrainFunction.apply("},{"line":147,"text":"            self, x, topk_ids, topk_weights, w1, w2, max_recv_tokens, limit, save_gmm1_output"},{"line":148,"text":"        )"},{"line":149,"text":""}]}],"formula":"op(...) → Module.forward(...) → Function.apply(...) → Function.forward(...)","ordinal":1,"x":58,"y":112,"w":296,"h":124,"color":"python"},{"id":"fc_function","lane":"python","step":1,"title":"Function.forward 调执行器","subtitle":"检查实例与stream状态","symbol":"_MegaMoeBF16TrainFunction.forward","description":["Function.forward 先调用 op._check_ready，默认只在本地检查 p dtype 是否为 BF16 或 FP32，再调用 op._executor.forward。_executor 是训练包 _C.BF16 对象，负责启动前向 kernel。整数 IDs 用于路由，p 是 BF16 或 FP32 的可微浮点输入。","构造时设置 debug_collectives=True，才在每次原生调用前集体核对当前前向／反向阶段和 p dtype。各 rank 仍须保证 dtype 和调用顺序相容；该检查不核对图身份、全部调用参数或完整操作序列。","ctx 是本次 Function 调用的上下文。前向结束后，它保存本次反向需要的 Tensor 和调用配置；反向时由 autograd 把同一个 ctx 交给 Function.backward。"],"reads":["op、所有前向输入"],"writes":["ForwardResult引用"],"waits":["Module存活、创建stream一致"],"sources":[{"path":"experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py","anchor":"    def forward(ctx, op, x, ids, weights, w1, w2, max_recv, limit, mode):","occurrence":1,"line":50,"start":48,"end":58,"sha256":"86bb936a2721c1323df007efd97b83c50798295113edee5c02c1a11d1cc3a232","url":"https://github.com/xixing-321/DeepEP/blob/0b5f385fd404a09446d317235d5e31c01471ed94/experiments/megamoe_train/python/deep_ep_experimental/megamoe_train/bf16.py#L50","excerpt":[{"line":48,"text":"class _MegaMoeBF16TrainFunction(torch.autograd.Function):"},{"line":49,"text":"    @staticmethod"},{"line":50,"text":" r weight2, torch::Tensor expertTokenNums,"},{"line":293,"text":"                                   torch::Tensor trainingSavedState, torch::Tensor dispatchOutput,"},{"line":294,"text":"                                   int64_t maxRecvTokens, int rank, int worldSize, std::size_t symmetricBufferBytes,"},{"line":295,"text":"                                   uint64_t ffts_addr, void* symmetricBuffer, double swigluLimit,"},{"line":296,"text":"                                   const std::string& save_gmm1_output)"},{"line":297,"text":"{"},{"line":298,"text":"    const int64_t m = gradY.size(0);"},{"line":299,"text":"    const int64_t k = gradY.size(1);"},{"line":300,"text":"    TORCH_CHECK(weight1.dim() == 3 && weight2.dim() == 3, \"weight1 and weight2 must be rank-3 tensors\");"},{"line":301,"text":"    const int64_t expertPerRank = weight1.size(0);"},{"line":302,"text":"    const auto weightLayout = ResolveBf16WeightLayout(weight1, weight2, k);"},{"line":303,"text":"    const int64_t n = weightLayout.n;"},{"line":304,"text":"    TORCH_CHECK(topkWeights.dim() == 2 && topkWeights.size(0) == m, \"topk_weights must have shape [m, topk]\");"},{"line":305,"text":"    const int64_t topk = topkWeights.size(1);"},{"line":306,"text":"    TORCH_CHECK(expertTokenNums.numel() == expertPerRank, \"expert_token_nums must have one entry per local expert\");"},{"line":307,"text":"    // Only persistent saved-state is consumed by backward."},{"line":308,"text":"    TORCH_CHECK(trainingSavedState.scalar_type() == torch::kUInt8 &&"},{"line":309,"text":"                    trainingSavedState.device().type() == c10::DeviceType::PrivateUse1,"},{"line":310,"text":"                \"training_saved_state must be an NPU UInt8 tensor\");"},{"line":311,"text":"    TORCH_CHECK(m > 0 && k > 0 && topk > 0 && expertPerRank > 0 && n > 0,"},{"line":312,"text":"                \"all MegaMoe BF16 backward dimensions must be positive\");"},{"line":313,"text":"    TORCH_CHECK(worldSize >= 2 && worldSize \u P/blob/0b5f385fd404a09446d317235d5e31c01471ed94/experiments/megamoe_train/csrc/kernels/bf16/epilogue/block_epilogue_swiglu_backward_bf16.hpp#L446","excerpt":[{"line":446,"text":"    // Tail tiles reconstruct H in FP32, producing BF16 Hp and FP32 dp partials."},{"line":447,"text":"    // Gate is dead after its row is consumed, so its first FP32 slot stores the partial."},{"line":448,"text":"    __aicore__ inline void ComputeForwardAux(uint16_t mSize, uint16_t nSize, uint32_t rowStride)"},{"line":449,"text":"    {"},{"line":450,"text":"        constexpr uint16_t lanes = 256U / sizeof(float);"},{"line":451,"text":"        const float limit = params_.swigluLimit;"},{"line":452,"text":"        const bool limitEnabled = limit != kMegaMoeSwigluLimitDisabled;"},{"line":453,"text":"        auto* dHp = (__ubuf__ bfloat16_t*)l0cOutUbFirst_.GetPhyAddr();"},{"line":454,"text":"        auto* gate = (__ubuf__ bfloat16_t*)l0cOutUbSecond_.GetPhyAddr();"},{"line":455,"text":"        auto* up = (__ubuf__ bfloat16_t*)extraA_.GetPhyAddr();"},{"line":456,"text":"        auto* weights = (__ubuf__ TopkWeightT*)packedWeightUb_.GetPhyAddr();"},{"line":457,"text":"        auto* partials = (__ubuf__ float*)l0cOutUbSecond_.GetPhyAddr();"},{"line":458,"text":""},{"line":459,"text":"        __VEC_SCOPE__"},{"line":460,"text":"        {"},{"line":461,"text":"            for (uint16_t row = 0; row \u003c mSize; ++row) {"},{"line":462,"text":"                auto oneLane = AscendC::Reg::CreateMask\u003cfloat, AscendC::Reg::MaskPattern::VL1>();"},{"line":463,"text":"                auto all = AscendC::Reg::CreateMask\u003cfloat, AscendC::Reg::MaskPattern::ALL>();"},{"line":464,"text":"                AscendC::Reg::RegTensor\u003cfloat> accumulated, pFp, limitFp, negLimitFp;"},{"line":465,"text":"                AscendC::Reg::RegTensor\u003cbfloat16_t> pBf;"},{"line":466,"text":"                AscendC::Reg::Duplicate(accumulated, 0.0F, oneLane);"},{"line":467,"text":"                if constexpr (std::is_same_v\u003cTopkWeightT, bfloat16_t>) {"},{"line":468,"text":"                    AscendC::Reg::DataCopy\u003cbfloat16_t, AscendC::Reg::LoadDist::DIST_BRC_B16>(pBf, weights + row);"},{"line":469,"text":"                    AscendC::Reg::Cast\u003cfloat, bfloat16_t, kBackwardCastBF16ToFP32>(pFp, pBf, all);"},{"line":470,"text":"                } else {"},{"line":471,"text":"                    AscendC::Reg::DataCopy\u003cfloat, AscendC::Reg::LoadDist::DIST_BRC_B32>(pFp, weights + row);"},{"line":472,"text":"                }"},{"line":473,"text":"                if (limitEnabled) {"},{"line":474,"text":"                    AscendC::Reg::Duplicate(limitFp, limit, all);"},{"line":475,"text":"                    AscendC::Reg::Duplicate(negLimitFp, -limit, all);"},{"line":476,"text":"                }"},{"line":477,"text":"                uint32_t remaining = nSize;"},{"line":478,"text":"                for (uint16_t col = 0; col \u003c nSize; col += lanes) {"},{"line":479,"text":"                    auto mask = AscendC::Reg::UpdateMask\u003cfloat>(remaining);"},{"line":480,"text":"                    const uint32_t offset = static_cast\u003cuint32_t>(row) * rowStride + col;"},{"line":481,"text":"                    AscendC::Reg::RegTensor\u003cbfloat16_t> gateBf, upBf, dHpBf, hpBf;"},{"line":482,"text":"                    AscendC::Reg::RegTensor\u003cfloat> gateFp, upFp, dHpFp, neg, exp, denom, silu;"},{"line":483,"text":"                    AscendC::Reg::RegTensor\u003cfloat> hFp, hpFp, productFp, rowSum;"},{"line":484,"text":"                    AscendC::Reg::DataCopy\u003cbfloat16_t, AscendC::Reg::LoadDist::DIST_UNPACK_B16>(gateBf, gate + offset);"},{"line":485,"text":"                    AscendC::Reg::DataCopy\u003cbfloat16_t, AscendC::Reg::LoadDist::DIST_UNPACK_B16>(upBf, up + offset);"},{"line":486,"text":"                    AscendC::Reg::DataCopy\u003cbfloat16_t, AscendC::Reg::LoadDist::DIST_UNPACK_B16>(dHpBf, dHp + offset);"},{"line":487,"text":"                    AscendC::Reg::Cast\u003cfloat, bfloat16_t, kBackwardCastBF16ToFP32>(gateFp, gateBf, mask);"},{"line":488,"text":"                    AscendC::Reg::Cast\u003cfloat, bfloat16_t, kBackwardCastBF16ToFP32>(upFp, upBf, mask);"},{"line":489,"text":"                    AscendC::Reg::Cast\u003cfloat, bfloat16_t, kBackwardCastBF16ToFP32>(dHpFp, dHpBf, mask);"},{"line":490,"text":"                    if (limitEnabled) {"},{"line":491,"text":"                        AscendC::Reg::Min(gateFp, gateFp, limitFp, mask);"},{"line":492,"text":"                        AscendC::Reg::Max(upFp, upFp, negLimitFp, mask);"},{"line":493,"text":"                        AscendC::Reg::Min(upFp, upFp, limitFp, mask);"},{"line":494,"text":"                    }"},{"line":495,"text":"                    AscendC::Reg::Muls(neg, gateFp, -1.0F, mask);"},{"line":496,"text":"                    AscendC::Reg::Exp(exp, neg, mask);"},{"line":497,"text":"                    AscendC::Reg::Adds(denom, exp, 1.0F, mask);"},{"line":498,"text":"                    AscendC::Reg::Div\u003cfloat, &kBackwardDivMode>(silu, gateFp, denom, mask);"},{"line":499,"text":"                    AscendC::Reg::Mul(hFp, silu, upFp, mask);"},{"line":500,"text":"                    AscendC::Reg::Mul(productFp, dHpFp, hFp, mask);"},{"line":501,"text":"                    AscendC::Reg::ReduceSum(rowSum, productFp, mask);"},{"line":502,"text":"                    AscendC::Reg::Add(accumulated, accumulated, rowSum, oneLane);"},{"line":503,"text":"                    AscendC::Reg::Mul(hpFp, hFp, pFp, mask);"},{"line":504,"text":"                    AscendC::Reg::Cast\u003cbfloat16_t, float, kBackwardCastFP32ToBF16>(hpBf, hpFp, mask);"},{"line":505,"text":"                    AscendC::Reg::DataCopy\u003cbfloat16_t, AscendC::Reg::StoreDist::DIST_PACK_B32>(up + offset, hpBf, mask);"},{"line":506,"text":"                }"},{"line":507,"text":"                AscendC::Reg::DataCopy(partials + static_cast\u003cuint32_t>(row) * (ro >\u003ctd>e4 / slot4\u003c/td>\u003ctd>[0.25, 0.25]\u003c/td>\u003ctd>[0.03125, 0.03125]\u003c/td>\u003ctd>[0.00488281, 0.00488281]\u003c/td>\u003ctd>[0.00439453, 0.00439453]\u003c/td>\u003ctd>[0.00488281, 0.00488281, 0.00439453, 0.00439453]\u003c/td>\u003ctd>\u003cstrong>[0.00463867, 0.00927734]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.0175781\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e5 / slot5\u003c/td>\u003ctd>[0.125, 0.5]\u003c/td>\u003ctd>[0.015625, 0.0625]\u003c/td>\u003ctd>[0.00576782, 0.00439453]\u003c/td>\u003ctd>[0.00485229, 0.00415039]\u003c/td>\u003ctd>[0.00576782, 0.00439453, 0.00485229, 0.00415039]\u003c/td>\u003ctd>\u003cstrong>[0.0106201, 0.00427246]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.0235596\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n      \u003cp class=\"learning-caption\">G、U 是 Gate、Up；SiLU′(G) = s × (1 + G × (1 − s))，s = sigmoid(G)。H、dH 与 dp 乘积保持 FP32。关闭 clipping 时按表中公式计算，R 表示舍入到 BF16。dZ 沿特征维拼接，前 F 列为 dGate，后 F 列为 dUp。\u003c/p>\n      \u003cp class=\"learning-caption\">dp 先对 F 分块归约，再得到每条 route 的标量。本例只有同一块内的 F0、F1 非零。\u003c/p>\n      \u003cdiv class=\"learning-equation\">dp(slot0) = R(Σ_FP32 (FP32(dHp) × H)) = \u003cstrong>0.0432129\u003c/strong>，点积使用保持 FP32 的未乘 p 激活 H。\u003c/div>\n      \u003cdiv class=\"learning-section-heading\">\u003cspan class=\"learning-section-number\">3\u003c/span>\u003ch3>区分回到 token 和留在专家的梯度\u003c/h3>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dw2\">dW2 / dW1 ↗\u003c/button>\u003c/div>\u003cdiv class=\"learning-gradient-result\">\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_unpermute_dx\">dX [M,H] 回到源rank ↗\u003c/button>\u003cstrong>[0.0869141, 0.0708008]\u003c/strong>\u003cspan>按 TopK 槽 FP32 累加，再舍入 BF16\u003c/span>\u003c/div>\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dp_output\">dp [M,TopK] 回到源rank ↗\u003c/button>\u003cstrong>[0.0432129, 0.0263672, 0.02771, 0.0196533, 0.0175781, 0.0235596]\u003c/strong>\u003cspan>按 6 个 TopK 槽分别保留\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"learning-table-wrap \">\u003ctable class=\"learning-table\">\u003cthead>\u003ctr>\u003cth>专家梯度归属\u003c/th>\u003cth>本route对dW2[0,0]的贡献\u003c/th>\u003cth>本route对dW1[0,0]的贡献\u003c/th>\u003cth>该专家全部 6144 条 route 的最终梯度\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>e0 → 留在rank0\u003c/td>\u003ctd>0.25 × 0.0388184 = 0.00970459\u003c/td>\u003ctd>0.0230713 × 0.5 = 0.0115356\u003c/td>\u003ctd>dW2[0,0]=232\u003cbr>dW1[0,0]=294\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e1 → 留在rank0\u003c/td>\u003ctd>0.25 × 0.0175781 = 0.00439453\u003c/td>\u003ctd>0.00976563 × 0.5 = 0.00488281\u003c/td>\u003ctd>dW2[0,0]=98\u003cbr>dW1[0,0]=119\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e2 → 留在rank0\u003c/td>\u003ctd>0.25 × 0.00970459 = 0.00242615\u003c/td>\u003ctd>0.00576782 × 0.5 = 0.00288391\u003c/td>\u003ctd>dW2[0,0]=116\u003cbr>dW1[0,0]=147\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e3 → 留在rank0\u003c/td>\u003ctd>0.25 × 0.00878906 = 0.00219727\u003c/td>\u003ctd>0.00976563 × 0.5 = 0.00488281\u003c/td>\u003ctd>dW2[0,0]=98\u003cbr>dW1[0,0]=238\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e4 → 留在rank1\u003c/td>\u003ctd>0.25 × 0.00439453 = 0.00109863\u003c/td>\u003ctd>0.00488281 × 0.5 = 0.00244141\u003c/td>\u003ctd>dW2[0,0]=49\u003cbr>dW1[0,0]=119\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e5 → 留在rank1\u003c/td>\u003ctd>0.25 × 0.0194092 = 0.00485229\u003c/td>\u003ctd>0.00576782 × 0.5 = 0.00288391\u003c/td>\u003ctd>dW2[0,0]=232\u003cbr>dW1[0,0]=147\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"learning-caption\">dW2 = R(dOᵀ · Hp)，dW1 = R(dZᵀ · Xpacked)。单 route 的外积是 FP32 贡献，沿 6144 行累加后才舍入到 BF16。\u003c/p>\u003cdetails class=\"learning-expand\">\u003csummary>展开各 route 的完整非零权重梯度子块\u003c/summary>\u003cdiv class=\"learning-weights-grid\">\u003cdiv class=\"learning-weight-set\">\u003ch4>e0 · 单route贡献（FP32乘积）\u003c/h4>\u003cdiv class=\"learning-w  d=\"M255 399 H305 V572 H380\" class=\"learning-arrow learning-stroke-teal\" marker-end=\"url(#learning-arrow-4)\"/>\u003ctext x=\"273\" y=\"554\" class=\"learning-small\" text-anchor=\"start\">slot4 / p=0.125\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dispatch_do\" tabindex=\"0\" role=\"button\" aria-label=\"查看 e5 的 Dispatch\">\u003ctitle>查看 e5 的 Dispatch\u003c/title>\u003crect x=\"385\" y=\"519\" width=\"285\" height=\"108\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"402\" y=\"546\" class=\"learning-strong\" text-anchor=\"start\">e5 在 rank1\u003c/text>\u003ctext x=\"402\" y=\"573\" class=\"learning-small\" text-anchor=\"start\">源排序行 3841 → 专家行 1\u003c/text>\u003ctext x=\"402\" y=\"600\" class=\"learning-code\" text-anchor=\"start\">dO = dY = [0.25, 0.5]\u003c/text>\u003c/g>\u003cpath d=\"M670 572 H720 V399 H775\" class=\"learning-arrow learning-stroke-orange\" marker-end=\"url(#learning-arrow-4)\"/>\u003cpath d=\"M255 399 H305 V688 H380\" class=\"learning-arrow learning-stroke-teal\" marker-end=\"url(#learning-arrow-4)\"/>\u003ctext x=\"273\" y=\"670\" class=\"learning-small\" text-anchor=\"start\">slot5 / p=0.125\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dispatch_do\" tabindex=\"0\" role=\"button\" aria-label=\"查看 e6 的 Dispatch\">\u003ctitle>查看 e6 的 Dispatch\u003c/title>\u003crect x=\"385\" y=\"635\" width=\"285\" height=\"108\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"402\" y=\"662\" class=\"learning-strong\" text-anchor=\"start\">e6 在 rank1\u003c/text>\u003ctext x=\"402\" y=\"689\" class=\"learning-small\" text-anchor=\"start\">源排序行 4608 → 专家行 0\u003c/text>\u003ctext x=\"402\" y=\"716\" class=\"learning-code\" text-anchor=\"start\">dO = dY = [0.25, 0.5]\u003c/text>\u003c/g>\u003cpath d=\"M670 688 H720 V399 H775\" class=\"learning-arrow learning-stroke-orange\" marker-end=\"url(#learning-arrow-4)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_unpermute_dx\" tabindex=\"0\" role=\"button\" aria-label=\"查看源 rank 的归并\">\u003ctitle>查看源 rank 的归并\u003c/title>\u003crect x=\"780\" y=\"337\" width=\"270\" height=\"125\" rx=\"12\" class=\"learning-fill-orange\"/>\u003ctext x=\"798\" y=\"366\" class=\"learning-strong\" text-anchor=\"start\">回到原 rank0\u003c/text>\u003ctext x=\"798\" y=\"393\" class=\"learning-small\" text-anchor=\"start\">FP32 累加 route dX，再舍入 BF16\u003c/text>\u003ctext x=\"798\" y=\"423\" class=\"learning-code\" text-anchor=\"start\">dX = [0.15625, 0.178711]\u003c/text>\u003c/g>\u003ctext x=\"38\" y=\"768\" class=\"learning-small\" text-anchor=\"start\">p 在后续 FP32 dH = p × dHp 使用；这里发送的 dO 不先乘 p。\u003c/text>\u003c/svg>\u003c/div>\n      \u003cdiv class=\"learning-section-heading\">\u003cspan class=\"learning-section-number\">2\u003c/span>\u003ch3>从 dHp 走到激活梯度、dX 和 dp\u003c/h3>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_numeric\">SwiGLU 反向 ↗\u003c/button>\u003c/div>\n      \u003cdiv class=\"learning-table-wrap learning-numeric learning-backward-numeric\">\u003ctable class=\"learning-table\">\u003cthead>\u003ctr>\u003cth>route\u003c/th>\u003cth>dHp = R(dO · W2)\u003c/th>\u003cth>dH = FP32(dHp) × p\u003c/th>\u003cth>dGate =\nR((dH × U) × SiLU′(G))\u003c/th>\u003cth>dUp =\nR(dH × SiLU(G))\u003c/th>\u003cth>dZ = (dGate, dUp)\u003c/th>\u003cth>dXroute = R(dZ · W1)\u003c/th>\u003cth>dp_route\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>e1 / slot0\u003c/td>\u003ctd>[0.125, 0.5]\u003c/td>\u003ctd>[0.03125, 0.125]\u003c/td>\u003ctd>[0.0230713, 0.0461426]\u003c/td>\u003ctd>[0.00970459, 0.0388184]\u003c/td>\u003ctd>[0.0230713, 0.0461426, 0.00970459, 0.0388184]\u003c/td>\u003ctd>\u003cstrong>[0.0212402, 0.0849609]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.116699\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e2 / slot1\u003c/td>\u003ctd>[0.25, 0.5]\u003c/td>\u003ctd>[0.0625, 0.125]\u003c/td>\u003ctd>[0.0289307, 0.0390625]\u003c/td>\u003ctd>[0.0456543, 0.0175781]\u003c/td>\u003ctd>[0.0289307, 0.0390625, 0.0456543, 0.0175781]\u003c/td>\u003ctd>\u003cstrong>[0.0517578, 0.0371094]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.126953\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e3 / slot2\u003c/td>\u003ctd>[0.25, 0.25]\u003c/td>\u003ctd>[0.03125, 0.03125]\u003c/td>\u003ctd>[0.0230713, 0.00488281]\u003c/td>\u003ctd>[0.00970459, 0.00439453]\u003c/td>\u003ctd>[0.0230713, 0.00488281, 0.00970459, 0.00439453]\u003c/td>\u003ctd>\u003cstrong>[0.0212402, 0.00463867]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.0864258\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e4 / slot3\u003c/td>\u003ctd>[0.25, 0.25]\u003c/td>\u003ctd>[0.03125, 0.03125]\u003c/td>\u003ctd>[0.0115356, 0.0115356]\u003c/td>\u003ctd>[0.00970459, 0.00970459]\u003c/td>\u003ctd>[0.0115356, 0.0115356, 0.00970459, 0.00970459]\u003c/td>\u003ctd>\u003cstrong>[0.0106201, 0.0212402]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.0776367\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e5 / slot4\u003c/td>\u003ctd>[0.125, 0.5]\u003c/td>\u003ctd>[0.015625, 0.0625]\u003c/td>\u003ctd>[0.0144653, 0.00976563]\u003c/td>\u003ctd>[0.0114136, 0.00878906]\u003c/td>\u003ctd>[0.0144653, 0.00976563, 0.0114136, 0.00878906]\u003c/td>\u003ctd>\u003cstrong>[0.0258789, 0.00927734]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.108887\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e6 / slot5\u003c/td>\u003ctd>[0.25, 0.5]\u003c/td>\u003ctd>[0.03125, 0.0625]\u003c/td>\u003ctd>[0.0144653, 0.0115356]\u003c/td>\u003ctd>[0.0228271, 0.0194092]\u003c/td>\u003ctd>[0.0144653, 0.0115356, 0.0228271, 0.0194092]\u003c/td>\u003ctd>\u003cstrong>[0.0258789, 0.0212402]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.129883\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n      \u003cp class=\"learning-caption\">G、U 是 Gate、Up；SiLU′(G) = s × (1 + G × (1 − s))，s = sigmoid(G)。H、dH 与 dp 乘积保持 FP32。关闭 clipping 时按表中公式计算，R 表示舍入到 BF16。dZ 沿特征维拼接，前 F 列为 dGate，后 F 列为 dUp。\u003c/p>\n      \u003cp class=\"learning-caption\">dp 先对 F 分块归约，再得到每条 route 的标量。本例只有同一块内的 F0、F1 非零。\u003c/p>\n      \u003cdiv class=\"learning-equation\">dp(slot0) = R(Σ_FP32 (FP32(dHp) × H)) = \u003cstrong>0.116699\u003c/strong>，点积使用保持 FP32 的未乘 p 激活 H。\u003c/div>\n      \u003cdiv class=\"learning-section-heading\">\u003cspan class=\"learning-section-number\">3\u003c/span>\u003ch3>区分回到 token 和留在专家的梯度\u003c/h3>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dw2\">dW2 / dW1 ↗\u003c/button>\u003c/div>\u003cdiv class=\"learning-gradient-result\">\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_unpermute_dx\">dX [M,H] 回到源rank ↗\u003c/button>\u003cstrong>[0.15625, 0.178711]\u003c/strong>\u003cspan>按 TopK 槽 FP32 累加，再舍入 BF16\u003c/span>\u003c/div>\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dp_output\">dp [M,TopK] 回到源rank ↗\u003c/button>\u003cstrong>[0.116699, 0.126953, 0.0864258, 0.0776367, 0.108887, 0.129883]\u003c/strong>\u003cspan>按 6 个 TopK 槽分别保留\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"learning-table-wrap \">\u003ctable class=\"learning-table\">\u003cthead>\u003ctr>\u003cth>专家梯度归属\u003c/th>\u003cth>本route对dW2[0,0]的贡献\u003c/th>\u003cth>本route对dW1[0,0]的贡献\u003c/th>\u003cth>该专家全部 6144 条 route 的最终梯度\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>e1 → 留在rank0\u003c/td>\u003ctd>0.25 × 0.0776367 = 0.0194092\u003c/td>\u003ctd>0.0230713 × 1 = 0.0230713\u003c/td>\u003ctd>dW2[0,0]=98\u003cbr>dW1[0,0]=119\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e2 → 留在rank0\u003c/td>\u003ctd>0.25 × 0.0913086 = 0.0228271\u003c/td>\u003ctd>0.0289307 × 1 = 0.0289307\u003c/td>\u003ctd>dW2[0,0]=116\u003cbr>dW1[0,0]=147\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e3 → 留在rank0\u003c/td>\u003ctd>0.25 × 0.0388184 = 0.00970459\u003c/td>\u003ctd>0.0230713 × 1 = 0.0230713\u003c/td>\u003ctd>dW2[0,0]=98\u003cbr>dW1[0,0]=238\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e4 → 留在rank1\u003c/td>\u003ctd>0.25 × 0.0194092 = 0.00485229\u003c/td>\u003ctd>0.0115356 × 1 = 0.0115356\u003c/td>\u003ctd>dW2[0,0]=49\u003cbr>dW1[0,0]=119\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e5 → 留在rank1\u003c/td>\u003ctd>0.25 × 0.0913086 = 0.0228271\u003c/td>\u003ctd>0.0144653 × 1 = 0.0144653\u003c/td>\u003ctd>dW2[0,0]=232\u003cbr>dW1[0,0]=147\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e6 → 留在rank1\u003c/td>\u003ctd>0.25 × 0.0456543 = 0.0114136\u003c/td>\u003ctd>0.0144653 × 1 = 0.0144653\u003c/td>\u003ctd>dW2[0,0]=116\u003cbr>dW1[0,0]=147\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"learning-caption\">dW2 = R(dOᵀ · Hp)，dW1 = R(dZᵀ · Xpacked)。单 route 的外积是 FP32 贡献，沿 6144 行累加后才舍入到 BF16。\u003c/p>\u003cdetails class=\"learning-expand\">\u003csummary>展开各 route 的完整非零权重梯度子块\u003c/summary>\u003cdiv class=\"learning-weights-grid\">\u003cdiv class=\"learning-weight-set\">\u003ch4>e1 · 单route贡献（FP32乘积）\u003c/h4>\u003cdiv class=\"learning-weight-pair\">\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dw2\">dW2贡献 [H0:H1,F0:F1] ↗\u003c/button>\u003ctable class=\"learning-matrix\">\u003ctbody>\u003ctr>\u003ctd>0.0194092\u003c/td>\u003ctd>0.00970459\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0.0388184\u003c/td>\u003ctd>0.0194092\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dw1\">dW1贡献：Gate0/1、Up0/1 ↗\u003c/button>\u003ctable class=\"learning-matrix\">\u003ctbody>\u003ctr>\u003cth>G0\u003c/th>\u003ctd>0.0230713\u003c/td>\u003ctd>0.0115356\u003c/td>\u003c/tr>\u003ctr>\u003cth>G1\u003c/th>\u003ctd>0.0461426\u003c/td>\u003ctd>0.0230713\u003c/td>\u003c/tr>\u003ctr>\u003cth>U0\u003c/th>\u003ctd>0.00970459\u003c/td>\u003ctd>0.00485229\u003c/td>\u003c/tr>\u003ctr>\u003cth>U1\u003c/th>\u003ctd>0.0388184\u003c/td>\u003ctd>0.0194092\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"learning-weight-set\">\u003ch4>e2 · 单route贡献（ g-table\">\u003cthead>\u003ctr>\u003cth>route\u003c/th>\u003cth>dHp = R(dO · W2)\u003c/th>\u003cth>dH = FP32(dHp) × p\u003c/th>\u003cth>dGate =\nR((dH × U) × SiLU′(G))\u003c/th>\u003cth>dUp =\nR(dH × SiLU(G))\u003c/th>\u003cth>dZ = (dGate, dUp)\u003c/th>\u003cth>dXroute = R(dZ · W1)\u003c/th>\u003cth>dp_route\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>e1 / slot0\u003c/td>\u003ctd>[0.125, 0.5]\u003c/td>\u003ctd>[0.03125, 0.125]\u003c/td>\u003ctd>[0.0230713, 0.0791016]\u003c/td>\u003ctd>[0.00970459, 0.0634766]\u003c/td>\u003ctd>[0.0230713, 0.0791016, 0.00970459, 0.0634766]\u003c/td>\u003ctd>\u003cstrong>[0.0212402, 0.142578]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.229492\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e2 / slot1\u003c/td>\u003ctd>[0.25, 0.5]\u003c/td>\u003ctd>[0.0625, 0.125]\u003c/td>\u003ctd>[0.0289307, 0.0639648]\u003c/td>\u003ctd>[0.0456543, 0.027832]\u003c/td>\u003ctd>[0.0289307, 0.0639648, 0.0456543, 0.027832]\u003c/td>\u003ctd>\u003cstrong>[0.0517578, 0.0598145]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.174805\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e3 / slot2\u003c/td>\u003ctd>[0.25, 0.25]\u003c/td>\u003ctd>[0.03125, 0.03125]\u003c/td>\u003ctd>[0.0230713, 0.00799561]\u003c/td>\u003ctd>[0.00970459, 0.00695801]\u003c/td>\u003ctd>[0.0230713, 0.00799561, 0.00970459, 0.00695801]\u003c/td>\u003ctd>\u003cstrong>[0.0212402, 0.00747681]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.0986328\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e4 / slot3\u003c/td>\u003ctd>[0.25, 0.25]\u003c/td>\u003ctd>[0.03125, 0.03125]\u003c/td>\u003ctd>[0.0115356, 0.0197754]\u003c/td>\u003ctd>[0.00970459, 0.0158691]\u003c/td>\u003ctd>[0.0115356, 0.0197754, 0.00970459, 0.0158691]\u003c/td>\u003ctd>\u003cstrong>[0.0106201, 0.0356445]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.134766\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e5 / slot4\u003c/td>\u003ctd>[0.125, 0.5]\u003c/td>\u003ctd>[0.015625, 0.0625]\u003c/td>\u003ctd>[0.0144653, 0.0159912]\u003c/td>\u003ctd>[0.0114136, 0.013916]\u003c/td>\u003ctd>[0.0144653, 0.0159912, 0.0114136, 0.013916]\u003c/td>\u003ctd>\u003cstrong>[0.0258789, 0.0149536]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.132813\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e6 / slot5\u003c/td>\u003ctd>[0.25, 0.5]\u003c/td>\u003ctd>[0.03125, 0.0625]\u003c/td>\u003ctd>[0.0144653, 0.0197754]\u003c/td>\u003ctd>[0.0228271, 0.0317383]\u003c/td>\u003ctd>[0.0144653, 0.0197754, 0.0228271, 0.0317383]\u003c/td>\u003ctd>\u003cstrong>[0.0258789, 0.0356445]\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.186523\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n      \u003cp class=\"learning-caption\">G、U 是 Gate、Up；SiLU′(G) = s × (1 + G × (1 − s))，s = sigmoid(G)。H、dH 与 dp 乘积保持 FP32。关闭 clipping 时按表中公式计算，R 表示舍入到 BF16。dZ 沿特征维拼接，前 F 列为 dGate，后 F 列为 dUp。\u003c/p>\n      \u003cp class=\"learning-caption\">dp 先对 F 分块归约，再得到每条 route 的标量。本例只有同一块内的 F0、F1 非零。\u003c/p>\n      \u003cdiv class=\"learning-equation\">dp(slot0) = R(Σ_FP32 (FP32(dHp) × H)) = \u003cstrong>0.229492\u003c/strong>，点积使用保持 FP32 的未乘 p 激活 H。\u003c/div>\n      \u003cdiv class=\"learning-section-heading\">\u003cspan class=\"learning-section-number\">3\u003c/span>\u003ch3>区分回到 token 和留在专家的梯度\u003c/h3>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dw2\">dW2 / dW1 ↗\u003c/button>\u003c/div>\u003cdiv class=\"learning-gradient-result\">\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_unpermute_dx\">dX [M,H] 回到源rank ↗\u003c/button>\u003cstrong>[0.15625, 0.296875]\u003c/strong>\u003cspan>按 TopK 槽 FP32 累加，再舍入 BF16\u003c/span>\u003c/div>\u003cdiv>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dp_output\">dp [M,TopK] 回到源rank ↗\u003c/button>\u003cstrong>[0.229492, 0.174805, 0.0986328, 0.134766, 0.132813, 0.186523]\u003c/strong>\u003cspan>按 6 个 TopK 槽分别保留\u003c/span>\u003c/div>\u003c/div> xt>\u003c/g>\u003c/g>\u003cg data-learning-resource=\"saved-4\" data-learning-resource-label=\"专家计数 / source 前缀\" data-learning-node=\"f_counts\" tabindex=\"0\" role=\"button\" aria-label=\"专家计数 / source 前缀的生产与消费\">\u003cg class=\"learning-hotspot\" data-learning-node=\"f_counts\" tabindex=\"0\" role=\"button\" aria-label=\"计数交换与前缀\">\u003ctitle>计数交换与前缀\u003c/title>\u003crect x=\"45\" y=\"489\" width=\"270\" height=\"65\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"63\" y=\"516\" class=\"learning-medium\" text-anchor=\"start\">计数交换与前缀\u003c/text>\u003ctext x=\"63\" y=\"538\" class=\"learning-tiny\" text-anchor=\"start\">点开定位生产者\u003c/text>\u003c/g>\u003cpath d=\"M315 522 H395\" class=\"learning-arrow learning-stroke-blue\" marker-end=\"url(#learning-arrow-7)\"/>\u003crect x=\"400\" y=\"481\" width=\"340\" height=\"82\" rx=\"12\" class=\"learning-fill-violet\"/>\u003ctext x=\"420\" y=\"511\" class=\"learning-strong\" text-anchor=\"start\">专家计数 / source 前缀\u003c/text>\u003ctext x=\"420\" y=\"537\" class=\"learning-small\" text-anchor=\"start\">saved_state · 实际行数和源分段\u003c/text>\u003cpath d=\"M740 522 H800\" class=\"learning-arrow learning-stroke-violet\" marker-end=\"url(#learning-arrow-7)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_restore_counts\" tabindex=\"0\" role=\"button\" aria-label=\"恢复 Dispatch / 回传行段\">\u003ctitle>恢复 Dispatch / 回传行段\u003c/title>\u003crect x=\"805\" y=\"489\" width=\"335\" height=\"65\" rx=\"7\" class=\"learning-fill-teal\"/>\u003ctext x=\"819\" y=\"528\" class=\"learning-medium\" text-anchor=\"start\">恢复 Dispatch / 回传行段\u003c/text>\u003c/g>\u003c/g>\u003c/svg>\u003c/div>\u003cp class=\"learning-caption\">W1/W2 由 ctx 保持参数引用；上图是算子生成的持久状态。前向临时 Hp 不跨越反向，反向用 Gate/Up 和 p 重建。none 模式不保存 Gate/Up，而用 Xpacked、W1 重算 GMM1；本图固定 bf16。\u003c/p>\u003cdiv class=\"learning-section-heading\">\u003cspan class=\"learning-section-number\">2\u003c/span>\u003ch3>写入新含义之前，旧读者必须全部结束\u003c/h3>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"m_do_last_reader\">内存复用协议 ↗\u003c/button>\u003c/div>\u003cdiv class=\"learning-diagram\">\u003csvg class=\"learning-svg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 460\" role=\"img\" aria-label=\"dHp到Hp、dO到dX和ptrD的三次复用\">\u003cdefs>\u003cmarker id=\"learning-arrow-8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10z\" fill=\"#74839a\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"25\" y=\"27\" class=\"learning-svg-title\" text-anchor=\"start\">同一地址，按依赖切换用途\u003c/text>\u003ctext x=\"25\" y=\"51\" class=\"learning-small\" text-anchor=\"start\">每行只表达该内存的局部生命期；横向长度不代表时间或字节比例。\u003c/text>\u003ctext x=\"25\" y=\"124\" class=\"learning-code\" text-anchor=\"start\">ptrHp [R,F]\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dhp\" tabindex=\"0\" role=\"button\" aria-label=\"暂存 dHp = R(dO×W2)\">\u003ctitle>暂存 dHp = R(dO×W2)\u003c/title>\u003crect x=\"220\" y=\"90\" width=\"330\" height=\"70\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"239\" y=\"119\" class=\"learning-strong\" text-anchor=\"start\">暂存 dHp = R(dO×W2)\u003c/text>\u003ctext x=\"239\" y=\"144\" class=\"learning-small\" text-anchor=\"start\">整专家 dHpReady 后，owner 先读入 tile UB\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"m_hp_overwrite\" tabindex=\"0\" role=\"button\" aria-label=\"本 tile dHp 已读入 UB\">\u003ctitle>本 tile dHp 已读入 UB\u003c/title>\u003cpath d=\"M575 84 V167\" class=\"learning-boundary\"/>\u003ctext x=\"578\" y=\"77\" class=\"learning-tiny\" text-anchor=\"middle\">本 tile dHp 已读入 UB\u003c/text>\u003c/g>\u003cpath d=\"M550 125 H625\" class=\"learning-arrow learning-stroke-violet\" marker-end=\"url(#learning-arrow-8)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_numeric\" tabindex=\"0\" role=\"button\" aria-label=\"改存重建 Hp = R(H×p)\">\u003ctitle>改存重建 Hp = R(H×p)\u003c/title>\u003crect x=\"630\" y=\"90\" width=\"430\" height=\"70\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"648\" y=\"119\" class=\"learning-strong\" text-anchor=\"start\">改存重建 Hp = R(H×p)\u003c/text>\u003ctext x=\"648\" y=\"144\" class=\"learning-small\" text-anchor=\"start\">各 tile 独占；P2 用于 dW2\u003c/text>\u003c/g>\u003ctext x=\"25\" y=\"241\" class=\"learning-code\" text-anchor=\"start\">ptrDO = ptrDX\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dw2\" tabindex=\"0\" role=\"button\" aria-label=\"保留原始 dO\">\u003ctitle>保留原始 dO\u003c/title>\u003crect x=\"220\" y=\"207\" width=\"330\" height=\"70\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"239\" y=\"236\" class=\"learning-strong\" text-anchor=\"start\">保留原始 dO\u003c/text>\u003ctext x=\"239\" y=\"261\" class=\"learning-small\" text-anchor=\"start\">dHp GEMM 与 dW2 都需要读取\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_do_release\" tabindex=\"0\" role=\"button\" aria-label=\"DOReleased = blockNum\">\u003ctitle>DOReleased = blockNum\u003c/title>\u003cpath d=\"M575 201 V284\" class=\"learning-boundary\"/>\u003ctext x=\"578\" y=\"194\" class=\"learning-tiny\" text-anchor=\"middle\">DOReleased = blockNum\u003c/text>\u003c/g>\u003cpath d=\"M550 242 H625\" class=\"learning-arrow learning-stroke-violet\" marker-end=\"url(#learning-arrow-8)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dx\" tabindex=\"0\" role=\"button\" aria-label=\"覆盖为 dXroute\">\u003ctitle>覆盖为 dXroute\u003c/title>\u003crect x=\"630\" y=\"207\" width=\"430\" height=\"70\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"648\" y=\"236\" class=\"learning-strong\" text-anchor=\"start\">覆盖为 dXroute\u003c/text>\u003ctext x=\"648\" y=\"261\" class=\"learning-small\" text-anchor=\"start\">AIC 写 GM → DXReady → AIV0 回传\u003c/text>\u003c/g>\u003ctext x=\"25\" y=\"358\" class=\"learning-code\" text-anchor=\"start\">SHMEM ptrD\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dx_send\" tabindex=\"0\" role=\"button\" aria-label=\"接收 routed dX 矩阵\">\u003ctitle>接收 routed dX 矩阵\u003c/title>\u003crect x=\"220\" y=\"324\" width=\"330\" height=\"70\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"239\" y=\"353\" class=\"learning-strong\" text-anchor=\"start\">接收 routed dX 矩阵\u003c/text>\u003ctext x=\"239\" y=\"378\" class=\"learning-small\" text-anchor=\"start\">源 rank 读完 TopK 行并得到 grad_x\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_reuse_ptrd\" tabindex=\"0\" role=\"button\" aria-label=\"所有 rank 的 dX 读者退出\">\u003ctitle>所有 rank 的 dX 读者退出\u003c/title>\u003cpath d=\"M575 318 V401\" class=\"learning-boundary\"/>\u003ctext x=\"578\" y=\"311\" class=\"learning-tiny\" text-anchor=\"middle\">所有 rank 的 dX 读者退出\u003c/text>\u003c/g>\u003cpath d=\"M550 359 H625\" class=\"learning-arrow learning-stroke-violet\" marker-end=\"url(#learning-arrow-8)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_reduce_dp\" tabindex=\"0\" role=\"button\" aria-label=\"复用为连续 dp 标量表\">\u003ctitle>复用为连续 dp 标量表\u003c/title>\u003crect x=\"630\" y=\"324\" width=\"430\" height=\"70\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"648\" y=\"353\" class=\"learning-strong\" text-anchor=\"start\">复用为连续 dp 标量表\u003c/text>\u003ctext x=\"648\" y=\"378\" class=\"learning-small\" text-anchor=\"start\">P6 回传后按逆置换恢复 [M,TopK]\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv class=\"learning-memory-footer\">\u003cspan>\u003cstrong>packed X/p\u003c/strong>、原始 Gate/Up、路由元数据：活到匹配反向。\u003c/span>\u003cspan>\u003cstrong>前向 Hp / ready\u003c/strong>：当前前向临时区。\u003c/span>\u003cspan>\u003cstrong>反向 dO/dX、Hp、dZ、dp partial\u003c/strong>：当前反向 scratch。\u003c/span>\u003c/div>\u003c/div>"},{"id":"learn-pipeline","title":"前后向流水与缓冲复用","summary":"在 rank0 的前后向专家时间轴上调节耗时、点等待查看源码，再用独立练习展开 GMM2 双槽。","sourceNode":"f_routes","html":"\u003cdiv class=\"learning-scene learning-pipeline-scene\">\n    \u003cdiv class=\"learning-context\">\u003cstrong>流水仿真\u003c/strong>\u003cspan>EP8 · 全局32专家 · 每源M4096 · TopK6\u003c/span>\u003cspan>H7168 / F3072 · saved-bf16\u003c/span>\u003c/div>\u003csection class=\"gmm2-simulation full-pipeline\" data-full-pipeline aria-labelledby=\"full-pipeline-title\">\n    \u003ch3 id=\"full-pipeline-title\">普通 BF16 完整流水\u003c/h3>\n    \u003cp class=\"learning-caption\">EP8 · 固定 rank0 · 每 rank 4 个专家。显示一个代表核组，其他核组和 rank 参与就绪判断。阶段窗口包含内部等待，默认教学 tick 参考打点图的阶段比例。\u003c/p>\n    \u003cdiv class=\"gmm2-presets\" role=\"group\" aria-label=\"前后向总览\">\n      \u003cbutton type=\"button\" data-overview-direction=\"forward\">前向总览\u003c/button>\n      \u003cbutton type=\"button\" data-overview-direction=\"backward\">反向总览\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"pipeline-overview-controls\">\n      \u003clabel>调节阶段 \u003cselect data-overview-stage>\u003c/select>\u003c/label>\n      \u003clabel class=\"pipeline-duration\">工作耗时 \u003cinput type=\"range\" data-overview-ticks>\u003coutput data-overview-tick-value>\u003c/output>\u003c/label>\n      \u003cbutton type=\"button\" data-overview-reset>恢复默认\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"gmm2-summary\" data-overview-end aria-live=\"polite\">\u003c/div>\n    \u003cdiv class=\"gmm2-chart-scroll\" data-overview-chart role=\"region\" aria-label=\"AIC、AIV0、AIV1 完整时间轴\" tabindex=\"0\">\u003c/div>\n    \u003cdiv class=\"gmm2-legend\" data-overview-legend aria-label=\"阶段图例\">\u003c/div>\n    \u003cp class=\"pipeline-overlap-note\" data-overview-overlap>\u003c/p>\n    \u003cp class=\"learning-caption\" data-overview-note>\u003c/p>\n    \u003clabel class=\"pipeline-wait-picker\">定位等待 \u003cselect data-overview-waits>\u003c/select>\u003c/label>\n    \u003cdiv class=\"gmm2-selection\" data-overview-detail aria-live=\"polite\">\u003c/div>\n  \u003c/section>\n    \u003cdetails class=\"pipeline-expand\" data-isolated-slots>\n      \u003csummary>打开独立双槽练习 · GMM2 → Combine\u003c/summary>\n      \u003csection class=\"gmm2-simulation\" data-gmm2-pipeline aria-labelledby=\"gmm2-title\">\n    \u003ch3 id=\"gmm2-title\">GMM2 → Combine 双槽流水仿真\u003c/h3>\n    \u003cp class=\"learning-caption\">一个核组连续处理同一专家的 6 个 tile。初始时，本核 Dispatch UB 已释放，专家 Hp 已写齐。耗时以教学 tick 表示。\u003c/p>\n    \u003cdiv class=\"gmm2-presets\" role=\"group\" aria-label=\"耗时预设\">\n      \u003cbutton type=\"button\" data-gmm2-preset=\"3,5\">搬运较慢 · 3 / 5\u003c/button>\n      \u003cbutton type=\"button\" data-gmm2-preset=\"5,3\">计算较慢 · 5 / 3\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"gmm2-controls\">\n      \u003cdiv>\u003clabel for=\"gmm2-compute\">GMM2 每 tile 计算耗时\u003c/label>\u003coutput id=\"gmm2-compute-value\" for=\"gmm2-compute\">\u003c/output>\u003cinput id=\"gmm2-compute\" type=\"range\" min=\"1\" max=\"20\" step=\"1\">\u003c/div>\n      \u003cdiv>\u003clabel for=\"gmm2-combine\">Combine 每 tile 搬运耗时\u003c/label>\u003coutput id=\"gmm2-combine-value\" for=\"gmm2-combine\">\u003c/output>\u003cinput id=\"gmm2-combine\" type=\"range\" min=\"1\" max=\"20\" step=\"1\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"gmm2-summary\" aria-live=\"polite\">\u003c/div>\n    \u003cdiv class=\"gmm2-chart-scroll\" role=\"region\" aria-label=\"GMM2、Combine 与两个 UB 槽的时间轴\" tabindex=\"0\">\u003c/div>\n    \u003cdiv class=\"gmm2-legend\" aria-label=\"时间轴图例\">\u003cspan>\u003ci class=\"compute\">\u003c/i>计算\u003c/span>\u003cspan>\u003ci class=\"send\">\u003c/i>搬运\u003c/span>\u003cspan>\u003ci class=\"wait\">\u003c/i>等待\u003c/span>\u003cspan>\u003ci class=\"hold\">\u003c/i>槽占用\u003c/span>\u003c/div>\n    \u003cdiv class=\"gmm2-selection\" aria-live=\"polite\">\u003c/div>\n  \u003c/section>\n      \u003cdiv class=\"learning-section-heading\">\u003cspan class=\"learning-section-number\">1\u003c/span>\u003ch3>把双槽协议真正展开三轮\u003c/h3>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"f_gmm2\">GMM2 与 Combine ↗\u003c/button>\u003c/div>\n      \u003cdiv class=\"learning-diagram\">\u003csvg class=\"learning-svg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1160 483\" role=\"img\" aria-label=\"GMM2双槽与AIC AIV0 AIV1依赖泳道\">\u003cdefs>\u003cmarker id=\"learning-arrow-9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10z\" fill=\"#74839a\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"25\" y=\"28\" class=\"learning-svg-title\" text-anchor=\"start\">同一核组的 GMM2 连续任务：tile0 / tile1 / tile2\u003c/text>\u003ctext x=\"25\" y=\"53\" class=\"learning-small\" text-anchor=\"start\">AIC 与两个配对 AIV；专家计数覆盖所有相关核。横向只是依赖顺序，不是实测时间轴。\u003c/text>\u003crect x=\"130\" y=\"77\" width=\"1005\" height=\"92\" rx=\"9\" class=\"learning-lane\"/>\u003ctext x=\"23\" y=\"118\" class=\"learning-medium\" text-anchor=\"start\">AIC · MMAD\u003c/text>\u003crect x=\"130\" y=\"207\" width=\"1005\" height=\"92\" rx=\"9\" class=\"learning-lane\"/>\u003ctext x=\"23\" y=\"248\" class=\"learning-medium\" text-anchor=\"start\">AIV0 · 激活\u003c/text>\u003crect x=\"130\" y=\"337\" width=\"1005\" height=\"92\" rx=\"9\" class=\"learning-lane\"/>\u003ctext x=\"23\" y=\"378\" class=\"learning-medium\" text-anchor=\"start\">AIV1 · 传输\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_gmm2\" tabindex=\"0\" role=\"button\" aria-label=\"计算 tile0\">\u003ctitle>计算 tile0\u003c/title>\u003crect x=\"315\" y=\"90\" width=\"135\" height=\"62\" rx=\"12\" class=\"learning-fill-orange\"/>\u003ctext x=\"328\" y=\"115\" class=\"learning-medium\" text-anchor=\"start\">计算 tile0\u003c/text>\u003ctext x=\"328\" y=\"137\" class=\"learning-tiny\" text-anchor=\"start\">输出到槽0\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_gmm2\" tabindex=\"0\" role=\"button\" aria-label=\"计算 tile1\">\u003ctitle>计算 tile1\u003c/title>\u003crect x=\"480\" y=\"90\" width=\"135\" height=\"62\" rx=\"12\" class=\"learning-fill-orange\"/>\u003ctext x=\"493\" y=\"115\" class=\"learning-medium\" text-anchor=\"start\">计算 tile1\u003c/text>\u003ctext x=\"493\" y=\"137\" class=\"learning-tiny\" text-anchor=\"start\">输出到槽1\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_gmm2\" tabindex=\"0\" role=\"button\" aria-label=\"等槽0归还\">\u003ctitle>等槽0归还\u003c/title>\u003crect x=\"645\" y=\"90\" width=\"125\" height=\"62\" rx=\"12\" class=\"learning-fill-neutral\"/>\u003ctext x=\"658\" y=\"115\" class=\"learning-medium\" text-anchor=\"start\">等槽0归还\u003c/text>\u003ctext x=\"658\" y=\"137\" class=\"learning-tiny\" text-anchor=\"start\">tile2不能覆盖\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_gmm2\" tabindex=\"0\" role=\"button\" aria-label=\"计算 tile2\">\u003ctitle>计算 tile2\u003c/title>\u003crect x=\"800\" y=\"90\" width=\"135\" height=\"62\" rx=\"12\" class=\"learning-fill-orange\"/>\u003ctext x=\"813\" y=\"115\" class=\"learning-medium\" text-anchor=\"start\">计算 tile2\u003c/text>\u003ctext x=\"813\" y=\"137\" class=\"learning-tiny\" text-anchor=\"start\">再次使用槽0\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_gmm2_wait\" tabindex=\"0\" role=\"button\" aria-label=\"当前专家 Hp 全齐\">\u003ctitle>当前专家 Hp 全齐\u003c/title>\u003crect x=\"145\" y=\"220\" width=\"160\" height=\"62\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"158\" y=\"245\" class=\"learning-medium\" text-anchor=\"start\">当前专家 Hp 全齐\u003c/text>\u003ctext x=\"158\" y=\"267\" class=\"learning-tiny\" text-anchor=\"start\">SwiGLU task计数\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_swiglu_p\" tabindex=\"0\" role=\"button\" aria-label=\"其他专家的 SwiGLU 尾部\">\u003ctitle>其他专家的 SwiGLU 尾部\u003c/title>\u003crect x=\"360\" y=\"220\" width=\"445\" height=\"62\" rx=\"12\" class=\"learning-fill-violet\"/>\u003ctext x=\"373\" y=\"245\" class=\"learning-medium\" text-anchor=\"start\">其他专家的 SwiGLU 尾部\u003c/text>\u003ctext x=\"373\" y=\"267\" class=\"learning-tiny\" text-anchor=\"start\">条件允许时，可与早专家GMM2交错；不是全卡统一阶段\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_release_dispatch_ub\" tabindex=\"0\" role=\"button\" aria-label=\"Dispatch 结束\">\u003ctitle>Dispatch 结束\u003c/title>\u003crect x=\"145\" y=\"350\" width=\"160\" height=\"62\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"158\" y=\"375\" class=\"learning-medium\" text-anchor=\"start\">Dispatch 结束\u003c/text>\u003ctext x=\"158\" y=\"397\" class=\"learning-tiny\" text-anchor=\"start\">释放本核AIV1 UB\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_combine\" tabindex=\"0\" role=\"button\" aria-label=\"发送 tile0 / 槽0\">\u003ctitle>发送 tile0 / 槽0\u003c/title>\u003crect x=\"480\" y=\"350\" width=\"255\" height=\"62\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"493\" y=\"375\" class=\"learning-medium\" text-anchor=\"start\">发送 tile0 / 槽0\u003c/text>\u003ctext x=\"493\" y=\"397\" class=\"learning-tiny\" text-anchor=\"start\">MTE3完成 → NotifyCube(槽0)\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_combine\" tabindex=\"0\" role=\"button\" aria-label=\"发送 tile1 / 槽1\">\u003ctitle>发送 tile1 / 槽1\u003c/title>\u003crect x=\"765\" y=\"350\" width=\"175\" height=\"62\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"778\" y=\"375\" class=\"learning-medium\" text-anchor=\"start\">发送 tile1 / 槽1\u003c/text>\u003ctext x=\"778\" y=\"397\" class=\"learning-tiny\" text-anchor=\"start\">完成后归还槽1\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"f_combine\" tabindex=\"0\" role=\"button\" aria-label=\"发送 tile2 / 槽0\">\u003ctitle>发送 tile2 / 槽0\u003c/title>\u003crect x=\"970\" y=\"350\" width=\"160\" height=\"62\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"983\" y=\"375\" class=\"learning-medium\" text-anchor=\"start\">发送 tile2 / 槽0\u003c/text>\u003ctext x=\"983\" y=\"397\" class=\"learning-tiny\" text-anchor=\"start\">复用后的新结果\u003c/text>\u003c/g>\u003cpath d=\"M305 251 H310 V121 H315\" class=\"learning-arrow learning-stroke-blue\" marker-end=\"url(#learning-arrow-9)\"/>\u003cpath d=\"M305 381 H310 V121\" class=\"learning-arrow learning-stroke-blue\" marker-end=\"url(#learning-arrow-9)\"/>\u003cpath d=\"M450 121 H465 V381 H480\" class=\"learning-arrow learning-stroke-orange\" marker-end=\"url(#learning-arrow-9)\"/>\u003ctext x=\"371\" y=\"181\" class=\"learning-small\" text-anchor=\"start\">tile ready\u003c/text>\u003cpath d=\"M615 121 H630 V305 H750 V381 H765\" class=\"learning-arrow learning-stroke-orange\" marker-end=\"url(#learning-arrow-9)\"/>\u003ctext x=\"651\" y=\"324\" class=\"learning-small\" text-anchor=\"start\">tile ready\u003c/text>\u003cpath d=\"M735 350 V180 H707 V152\" class=\"learning-arrow learning-stroke-teal\" marker-end=\"url(#learning-arrow-9)\"/>\u003ctext x=\"757\" y=\"188\" class=\"learning-small\" text-anchor=\"start\">槽0发送已完成\u003c/text>\u003cpath d=\"M935 121 H951 V381 H970\" class=\"learning-arrow learning-stroke-orange\" marker-end=\"url(#learning-arrow-9)\"/>\u003ctext x=\"146\" y=\"450\" class=\"learning-small\" text-anchor=\"start\">槽0：tile0 → 发送完 → tile2；槽1：tile1 → 发送完 → 下一次使用。GMM1 的 Gate/Up 两片 UB 是另一种用途。\u003c/text>\u003c/svg>\u003c/div>\n      \u003cp class=\"learning-caption\">先等本核 Dispatch 释放 UB、当前专家写完 Hp。tile0 发送期间可以计算 tile1，tile2 要等槽0归还。\u003c/p>\n    \u003c/details>\n    \u003cdiv class=\"learning-section-heading\">\u003cspan class=\"learning-section-number\">2\u003c/span>\u003ch3>反向 dW2、dX 与回传的退休顺序\u003c/h3>\u003cbutton type=\"button\" class=\"learning-source-chip\" data-learning-node=\"b_dw2\">P2 的实际顺序 ↗\u003c/button>\u003c/div>\u003cdiv class=\"learning-diagram\">\u003csvg class=\"learning-svg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1120 211\" role=\"img\" aria-label=\"反向dO复用的真实退休链\">\u003cdefs>\u003cmarker id=\"learning-arrow-10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10z\" fill=\"#74839a\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"25\" y=\"29\" class=\"learning-svg-title\" text-anchor=\"star rHp [R,F]\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dhp\" tabindex=\"0\" role=\"button\" aria-label=\"暂存 dHp = R(dO×W2)\">\u003ctitle>暂存 dHp = R(dO×W2)\u003c/title>\u003crect x=\"220\" y=\"90\" width=\"330\" height=\"70\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"239\" y=\"119\" class=\"learning-strong\" text-anchor=\"start\">暂存 dHp = R(dO×W2)\u003c/text>\u003ctext x=\"239\" y=\"144\" class=\"learning-small\" text-anchor=\"start\">整专家 dHpReady 后，owner 先读入 tile UB\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"m_hp_overwrite\" tabindex=\"0\" role=\"button\" aria-label=\"本 tile dHp 已读入 UB\">\u003ctitle>本 tile dHp 已读入 UB\u003c/title>\u003cpath d=\"M575 84 V167\" class=\"learning-boundary\"/>\u003ctext x=\"578\" y=\"77\" class=\"learning-tiny\" text-anchor=\"middle\">本 tile dHp 已读入 UB\u003c/text>\u003c/g>\u003cpath d=\"M550 125 H625\" class=\"learning-arrow learning-stroke-violet\" marker-end=\"url(#learning-arrow-11)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_numeric\" tabindex=\"0\" role=\"button\" aria-label=\"改存重建 Hp = R(H×p)\">\u003ctitle>改存重建 Hp = R(H×p)\u003c/title>\u003crect x=\"630\" y=\"90\" width=\"430\" height=\"70\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"648\" y=\"119\" class=\"learning-strong\" text-anchor=\"start\">改存重建 Hp = R(H×p)\u003c/text>\u003ctext x=\"648\" y=\"144\" class=\"learning-small\" text-anchor=\"start\">各 tile 独占；P2 用于 dW2\u003c/text>\u003c/g>\u003ctext x=\"25\" y=\"241\" class=\"learning-code\" text-anchor=\"start\">ptrDO = ptrDX\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dw2\" tabindex=\"0\" role=\"button\" aria-label=\"保留原始 dO\">\u003ctitle>保留原始 dO\u003c/title>\u003crect x=\"220\" y=\"207\" width=\"330\" height=\"70\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"239\" y=\"236\" class=\"learning-strong\" text-anchor=\"start\">保留原始 dO\u003c/text>\u003ctext x=\"239\" y=\"261\" class=\"learning-small\" text-anchor=\"start\">dHp GEMM 与 dW2 都需要读取\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_do_release\" tabindex=\"0\" role=\"button\" aria-label=\"DOReleased = blockNum\">\u003ctitle>DOReleased = blockNum\u003c/title>\u003cpath d=\"M575 201 V284\" class=\"learning-boundary\"/>\u003ctext x=\"578\" y=\"194\" class=\"learning-tiny\" text-anchor=\"middle\">DOReleased = blockNum\u003c/text>\u003c/g>\u003cpath d=\"M550 242 H625\" class=\"learning-arrow learning-stroke-violet\" marker-end=\"url(#learning-arrow-11)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dx\" tabindex=\"0\" role=\"button\" aria-label=\"覆盖为 dXroute\">\u003ctitle>覆盖为 dXroute\u003c/title>\u003crect x=\"630\" y=\"207\" width=\"430\" height=\"70\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"648\" y=\"236\" class=\"learning-strong\" text-anchor=\"start\">覆盖为 dXroute\u003c/text>\u003ctext x=\"648\" y=\"261\" class=\"learning-small\" text-anchor=\"start\">AIC 写 GM → DXReady → AIV0 回传\u003c/text>\u003c/g>\u003ctext x=\"25\" y=\"358\" class=\"learning-code\" text-anchor=\"start\">SHMEM ptrD\u003c/text>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_dx_send\" tabindex=\"0\" role=\"button\" aria-label=\"接收 routed dX 矩阵\">\u003ctitle>接收 routed dX 矩阵\u003c/title>\u003crect x=\"220\" y=\"324\" width=\"330\" height=\"70\" rx=\"12\" class=\"learning-fill-blue\"/>\u003ctext x=\"239\" y=\"353\" class=\"learning-strong\" text-anchor=\"start\">接收 routed dX 矩阵\u003c/text>\u003ctext x=\"239\" y=\"378\" class=\"learning-small\" text-anchor=\"start\">源 rank 读完 TopK 行并得到 grad_x\u003c/text>\u003c/g>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_reuse_ptrd\" tabindex=\"0\" role=\"button\" aria-label=\"所有 rank 的 dX 读者退出\">\u003ctitle>所有 rank 的 dX 读者退出\u003c/title>\u003cpath d=\"M575 318 V401\" class=\"learning-boundary\"/>\u003ctext x=\"578\" y=\"311\" class=\"learning-tiny\" text-anchor=\"middle\">所有 rank 的 dX 读者退出\u003c/text>\u003c/g>\u003cpath d=\"M550 359 H625\" class=\"learning-arrow learning-stroke-violet\" marker-end=\"url(#learning-arrow-11)\"/>\u003cg class=\"learning-hotspot\" data-learning-node=\"b_reduce_dp\" tabindex=\"0\" role=\"button\" aria-label=\"复用为连续 dp 标量表\">\u003ctitle>复用为连续 dp 标量表\u003c/title>\u003crect x=\"630\" y=\"324\" width=\"430\" height=\"70\" rx=\"12\" class=\"learning-fill-teal\"/>\u003ctext x=\"648\" y=\"353\" class=\"learning-strong\" text-anchor=\"start\">复用为连续 dp 标量表\u003c/text>\u003ctext x=\"648\" y=\"378\" class=\"learning-small\" text-anchor=\"start\">P6 回传后按逆置换恢复 [M,TopK]\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\n  \u003c/div>"}]}}</script>
  <script>// Copyright (c) 2026, Lu Lu

// Each lane advances independently. A gate records when its producer retires.
const pipelineSource = (node, index = 0) => ({ node, index });
function createPipelineSchedule() {
  const events = [];
  const cursors = new Map();
  const time = lane => cursors.get(lane) || 0;
  const add = (lane, start, end, event) => {
    if (start < end) events.push({ ...event, lane, start, end });
  };
  const run = (lane, ticks, event) => {
    const start = time(lane), end = start + ticks;
    add(lane, start, end, event);
    cursors.set(lane, end);
    return end;
  };
  const wait = (lane, readyAt, event) => run(lane, Math.max(0, readyAt - time(lane)), { ...event, kind: 'wait' });
  return { events, time, add, run, wait };
}

function waitForDispatchUb(schedule, lane, readyAt) {
  schedule.wait(lane, readyAt, {
    label: '等 Dispatch UB', waitFor: 'dispatch-ub', signal: 'WaitForVector(GMM2_UB_READY_FLAG + FLAG_ID_MAX)',
    detail: '本核 AIV1 排空 Dispatch 管线并释放 UB 后，调用 NotifyCube(GMM2_UB_READY_FLAG)。',
    source: pipelineSource('f_gmm2_wait'),
  });
}

function scheduleGmm2Tiles(schedule, lanes, tiles, computeTicks, combineTicks) {
  const { aic, aiv1, slots } = lanes;
  const returnedAt = [0, 0];
  for (const [tile, task] of tiles.entries()) {
    const slot = tile % 2;
    const tag = task.expert === undefined ? '' : `e${task.expert} `;
    if (task.hpReadyAt !== undefined) schedule.wait(aic, task.hpReadyAt, {
      stage: 'gmm2', label: `${tag}等 Hp`, waitFor: 'hp', signal: 'swigluFlags == target',
      detail: '当前专家所有 SwiGLU 任务完成 Hp 写入后，计数达到 GMM2 读取的目标值。',
      source: pipelineSource('f_gmm2_wait', 1),
    });
    schedule.wait(aic, returnedAt[slot], {
      stage: 'gmm2', label: `等槽${slot}`, tile, slot, waitFor: 'slot',
      signal: `WaitForVector(${slot} + FLAG_ID_MAX)`,
      detail: `tile${tile} 要复用槽${slot}。AIV1 发完 tile${tile - 2}、等待 MTE3 退休，再用 NotifyCube(${slot}) 归还槽。`,
      source: pipelineSource('f_gmm2'),
    });
    const computeStart = schedule.time(aic);
    const outputReadyAt = schedule.run(aic, computeTicks, {
      stage: 'gmm2', kind: 'compute', label: `${tag}算 tile${tile}`, tile, slot, expert: task.expert,
      signal: `NotifyVector(${slot} + FLAG_ID_MAX)`,
      detail: `AIC 计算 tile${tile}，结果写入槽${slot}，随后通知 AIV1。`,
      source: pipelineSource('f_gmm2'),
    });
    schedule.wait(aiv1, outputReadyAt, {
      stage: 'combine', label: `等 tile${tile}`, tile, slot, waitFor: 'output',
      signal: `WaitForCube(${slot})`,
      detail: `AIV1 等 tile${tile} 写入槽${slot}。AIC 计算完成后用 NotifyVector(${slot} + FLAG_ID_MAX) 发布结果。`,
      source: pipelineSource('f_combine', 1),
    });
    const sentAt = schedule.run(aiv1, combineTicks, {
      stage: 'combine', kind: 'send', label: `${tag}发 tile${tile}`, tile, slot, expert: task.expert,
      signal: `MTE3_V → NotifyCube(${slot})`,
      detail: `AIV1 从槽${slot} 读取 tile${tile} 并回传各源 rank。MTE3 完成后归还槽。`,
      source: pipelineSource('f_combine', 1),
    });
    schedule.add(slots[slot], computeStart, sentAt, {
      stage: 'combine', kind: 'hold', label: `${tag}tile${tile}`, tile, slot,
      signal: `NotifyCube(${slot})`,
      detail: `从 AIC 开始计算到 AIV1 发送退休，槽${slot} 始终由 tile${tile} 占用。`,
      source: pipelineSource('f_combine', 1),
    });
    returnedAt[slot] = sentAt;
  }
}

// The isolated exercise starts after the two entry gates by default.
function simulateGmm2Combine({ computeTicks, combineTicks, dispatchReadyAt = 0, hpReadyAt = 0, tileCount = 6 }) {
  const schedule = createPipelineSchedule();
  waitForDispatchUb(schedule, 'aic', dispatchReadyAt);
  schedule.run('aiv1', dispatchReadyAt, { kind: 'send', label: 'Dispatch', signal: 'GMM2_UB_READY_FLAG',
    detail: '本核 AIV1 完成 Dispatch 后释放 UB。', source: pipelineSource('f_release_dispatch_ub') });
  const tiles = Array.from({ length: tileCount }, (_, tile) => tile === 0 ? { hpReadyAt } : {});
  scheduleGmm2Tiles(schedule, { aic: 'aic', aiv1: 'aiv1', slots: ['slot0', 'slot1'] }, tiles, computeTicks, combineTicks);
  const { events } = schedule;
  const waitTicks = reason => events.filter(event => event.waitFor === reason)
    .reduce((total, event) => total + event.end - event.start, 0);
  return {
    lanes: [ ['aic', 'AIC'], ['aiv1', 'AIV1'], ['slot0', 'UB 槽 0'], ['slot1', 'UB 槽 1'] ],
    events, finish: schedule.time('aiv1'), slotWait: waitTicks('slot'), outputWait: waitTicks('output'),
  };
}

function renderShortWait(anchor, control, attributes) {
  return `<div class="pipeline-short-wait">
    <span class="pipeline-short-wait-line" style="left:${anchor}%" aria-hidden="true"></span>
    <svg class="pipeline-short-wait-leader" viewBox="0 0 100 13" preserveAspectRatio="none" aria-hidden="true">
      <path d="M${control} 13 L${anchor} 7 V2" vector-effect="non-scaling-stroke"/>
    </svg>
    <button type="button" class="pipeline-short-wait-button" style="left:${control}%" ${attributes}>等</button>
  </div>`;
}

function renderPipelineTimeline({ lanes, events, finish, origin = 0, pixelsPerTick = 14, overlaps = [], shortWaitTicks = 0 }) {
  const span = finish - origin;
  const percent = ticks => 100 * (ticks - origin) / span;
  const ticks = Array.from({ length: 6 }, (_, index) => origin + Math.round(span * index / 5));
  const axis = ticks.map(tick => `<span style="left:${percent(tick)}%">${tick}</span>`).join('');
  const guides = ticks.slice(1, -1).map(tick => `<i style="left:${percent(tick)}%"></i>`).join('');
  const overlapBands = overlaps.map(({ start, end }) =>
    `<i class="pipeline-overlap-band" style="left:${percent(start)}%;width:${100 * (end - start) / span}%"></i>`).join('');
  const isShortWait = event => event.kind === 'wait' && event.end - event.start <= shortWaitTicks;
  const rows = lanes.map(([id, label]) => {
    const shortCount = events.filter(event => event.lane === id && isShortWait(event)).length;
    // Give the controls their own rail so nearby waits keep separate hit targets.
    // The gap leaves room for a 24px button even at the minimum chart width.
    const gap = 6, inset = gap / 2;
    let previousControl = inset - gap, remaining = shortCount;
    const bars = events.map((event, index) => {
      if (event.lane !== id) return '';
      const title = `${label} · ${event.label} · ${event.start}–${event.end} tick`;
      const attributes = `data-sim-event="${index}" data-stage="${event.stage || ''}" data-wait-for="${event.waitFor || ''}" data-start="${event.start}" data-end="${event.end}" aria-pressed="false" aria-label="${title}" title="${title}"`;
      if (isShortWait(event)) {
        const anchor = percent((event.start + event.end) / 2);
        remaining -= 1;
        const lastAllowed = 100 - inset - remaining * gap;
        const control = Math.max(previousControl + gap, Math.min(anchor, lastAllowed));
        previousControl = control;
        return renderShortWait(anchor, control, attributes);
      }
      return `<button type="button" class="gmm2-segment ${event.kind}" ${attributes} style="left:${percent(event.start)}%;width:${100 * (event.end - event.start) / span}%">${event.shortLabel ?? event.label}</button>`;
    }).join('');
    return `<div class="gmm2-lane"><strong>${label}</strong><div class="gmm2-track${shortCount ? ' with-short-waits' : ''}">${guides}${overlapBands}${bars}</div></div>`;
  }).join('');
  return `<div class="gmm2-chart" style="min-width:${Math.max(560, span * pixelsPerTick + 82)}px"><div class="gmm2-lane gmm2-axis"><strong>tick</strong><div>${axis}</div></div>${rows}</div>`;
}

function showPipelineEvent(chart, detail, index, events, inspectSource, formula) {
  const segment = events[index];
  for (const bar of chart.querySelectorAll('[data-sim-event]')) bar.setAttribute('aria-pressed', String(Number(bar.dataset.simEvent) === index));
  detail.innerHTML = `<div><strong>${segment.label}</strong><span>${segment.start}–${segment.end} tick</span></div><p>${segment.kind === 'wait' ? '等待信号' : '交接信号'} <code>${segment.signal}</code></p><p>${segment.detail}</p><button type="button" class="learning-source-chip">查看对应源码 ↗</button>`;
  inspectSource(segment.source);
  const openSource = detail.querySelector('button');
  openSource.onclick = () => inspectSource(segment.source, true);
  if (formula) {
    const block = document.createElement('pre');
    block.className = 'formula';
    block.textContent = formula;
    openSource.before(block);
  }
}

function mountGmm2Pipeline(panel, inputs, inspectSource) {
  const compute = panel.querySelector('#gmm2-compute');
  const combine = panel.querySelector('#gmm2-combine');
  const chart = panel.querySelector('.gmm2-chart-scroll');
  const detail = panel.querySelector('.gmm2-selection');
  const hint = '点一段等待，查看它等的信号和解除条件。';
  let simulation;

  function redraw() {
    compute.value = inputs.computeTicks;
    combine.value = inputs.combineTicks;
    panel.querySelector('#gmm2-compute-value').value = `${compute.value} tick`;
    panel.querySelector('#gmm2-combine-value').value = `${combine.value} tick`;
    simulation = simulateGmm2Combine(inputs);
    chart.innerHTML = renderPipelineTimeline(simulation);
    panel.querySelector('.gmm2-summary').innerHTML = `<span>最后一块发完 <strong>${simulation.finish}</strong> tick</span><span>AIC 等槽 <strong>${simulation.slotWait}</strong> tick</span><span>AIV1 等输出 <strong>${simulation.outputWait}</strong> tick</span>`;
    detail.textContent = hint;
    for (const preset of panel.querySelectorAll('[data-gmm2-preset]')) {
      preset.setAttribute('aria-pressed', String(preset.dataset.gmm2Preset === `${compute.value},${combine.value}`));
    }
  }

  compute.oninput = combine.oninput = () => {
    inputs.computeTicks = compute.valueAsNumber;
    inputs.combineTicks = combine.valueAsNumber;
    redraw();
  };
  for (const preset of panel.querySelectorAll('[data-gmm2-preset]')) {
    preset.onclick = () => {
      [inputs.computeTicks, inputs.combineTicks] = preset.dataset.gmm2Preset.split(',').map(Number);
      redraw();
    };
  }
  chart.onclick = event => {
    const button = event.target.closest('[data-sim-event]');
    if (!button) return;
    showPipelineEvent(chart, detail, Number(button.dataset.simEvent), simulation.events, inspectSource);
  };
  redraw();
}
