<svg width="1100" height="884" style="width:1100px;height:884px;min-width:0;max-width:none" class="learning-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 884" role="img" aria-label="前向UB复用：Gather Dispatch Gate到Hp与GMM2双槽"><style>/* Copyright (c) 2026, Lu Lu
 * Modified by xixing 2026
 */

/* These rules style only the three learning scenes, not the existing graphs. */
.learning-scene{max-width:1220px;margin:0 auto;padding:20px 22px 30px;color:#263750;line-height:1.65}
[hidden]{display:none!important}
.learning-context{display:flex;align-items:center;gap:9px 18px;flex-wrap:wrap;padding:10px 13px;border-left:3px solid #4269a6;background:#eef4fc;border-radius:0 7px 7px 0;font-size:12px;color:#4d6587}
.learning-context strong{font-size:13px;color:#2f5182}
.learning-caption{font-size:12px;color:#6f7d90;line-height:1.75;margin:9px 0 16px}
.learning-routing-note{padding-bottom:12px;border-bottom:1px solid #e1e7ef}
.learning-lead{font-size:14px;color:#3c526e;margin:9px 0 14px}
.learning-section-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 13px}
.learning-section-heading h3{font-size:17px;font-weight:650;line-height:1.5;margin:0;color:#2b3f5b}
.learning-section-number{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#eaf0fa;color:#315b99;font-size:12px;font-weight:700;flex:none}
.learning-source-chip{border:0;border-bottom:1px dotted #9ab0cc;border-radius:0;background:none;padding:2px 0;color:#476c9b;cursor:pointer;font:inherit;font-size:11px;white-space:normal;text-align:left;line-height:1.5}
.learning-section-heading .learning-source-chip{margin-left:auto}
.learning-source-chip:hover{color:#214f8c;border-bottom-color:#214f8c;background:none}
.learning-source-chip:focus-visible{outline:2px solid #7fa8de;outline-offset:4px}
.learning-diagram{overflow-x:auto;margin:13px 0 9px;border:1px solid #e2e8f0;border-radius:9px;background:#fff}
.learning-svg{width:100%;height:auto;display:block;min-width:780px;color:#304764}
.learning-svg text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;fill:#405773;font-size:15px}
.learning-svg .learning-svg-title{font-size:19px;font-weight:650;fill:#2c435f}
.learning-svg .learning-strong{font-size:18px;font-weight:650;fill:#2d4868}
.learning-svg .learning-medium{font-size:16px;font-weight:550}
.learning-svg .learning-small{font-size:14px;fill:#627791}
.learning-svg .learning-tiny{font-size:12px;fill:#6e8097}
.learning-svg .learning-code{font-family:"Cascadia Code",Consolas,monospace;font-size:15px;fill:#34516e}
.learning-fill-blue{fill:#edf3fc;stroke:#a9bedb;stroke-width:1.25}
.learning-fill-teal{fill:#edf8f5;stroke:#9dc8bd;stroke-width:1.25}
.learning-fill-orange{fill:#fff5eb;stroke:#d7b798;stroke-width:1.25}
.learning-fill-violet{fill:#f3eef9;stroke:#beafd0;stroke-width:1.25}
.learning-fill-neutral{fill:#f3f5f8;stroke:#c6cdd7;stroke-width:1.25;stroke-dasharray:5 3}
.learning-stroke-blue{stroke:#7195c3}
.learning-stroke-teal{stroke:#6aab9b}
.learning-stroke-orange{stroke:#bb956c}
.learning-stroke-violet{stroke:#a28bb8}
.learning-arrow{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.learning-boundary{stroke:#9d80b3;stroke-width:2;stroke-dasharray:5 4;fill:none}
.learning-lane{fill:#fafbfd;stroke:#e0e6ef;stroke-width:1}
.learning-hotspot{cursor:pointer}
.learning-hotspot:hover>rect,.learning-hotspot:focus>rect{stroke:#456b9c;stroke-width:2.5}
.learning-hotspot:focus{outline:none}
[data-learning-node].selected>rect,[data-learning-node].learning-selected>rect,[data-learning-node].is-selected>rect{stroke:#2a61a7;stroke-width:3;filter:drop-shadow(0 1px 3px #315d9e24)}
button[data-learning-node].selected,button[data-learning-node].learning-selected,button[data-learning-node].is-selected{background:#eaf2ff;color:#224f87;border-bottom-color:#224f87}
.learning-table-wrap{max-width:100%;overflow-x:auto;border:1px solid #dfe6ef;border-radius:7px;background:#fff;margin:10px 0 13px}
.learning-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left;white-space:nowrap}
.learning-table th{padding:10px 12px;background:#f2f6fb;color:#526b8d;border-bottom:1px solid #dfe6ef;font-weight:600}
.learning-table td{padding:10px 12px;border-bottom:1px solid #eaf0f6;color:#405975;vertical-align:middle}
.learning-table tbody tr:last-child td{border-bottom:0}
.learning-table tbody tr:nth-child(even){background:#fbfcfe}
.learning-table strong{color:#2f5b8c;font-weight:650}
.learning-reuse-paths .learning-table{table-layout:fixed;white-space:normal;line-height:1.65}
.learning-numeric .learning-table{font-family:"Cascadia Code",Consolas,"Microsoft YaHei",monospace;font-size:11px}
.learning-numeric .learning-table th{font-family:Inter,"Microsoft YaHei",sans-serif;font-size:11px}
.learning-backward-numeric .learning-table th{white-space:pre-line}
.learning-backward-numeric .learning-table td{white-space:normal}
.learning-weights-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;margin:12px 0 18px}
.learning-weight-set{min-width:0;padding-bottom:6px;border-bottom:1px solid #dde6f0}
.learning-weight-set h4{font-size:13px;margin:0 0 10px;font-weight:650;color:#3f5877}
.learning-weight-triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.learning-weight-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.learning-matrix{width:100%;border-collapse:separate;border-spacing:3px;margin-top:7px;padding:2px 6px;border-left:2px solid #bac9dc;border-right:2px solid #bac9dc;font-family:"Cascadia Code",Consolas,monospace;font-size:12px}
.learning-matrix td{padding:4px 5px;text-align:center;background:#f2f6fb;min-width:24px;color:#355b85}
.learning-matrix th{font-size:10px;font-weight:500;color:#778aa2;padding-right:5px;text-align:left}
.learning-equation{font-size:13px;color:#536c8c;padding:13px 15px;margin:12px 0;border-left:3px solid #b5c8e0;background:#f3f7fc;overflow-wrap:anywhere}
.learning-equation strong{color:#2b568a}
.learning-gradient-result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin:13px 0 20px}
.learning-gradient-result>div{display:flex;flex-direction:column;gap:5px;padding:13px 0;border-top:2px solid #a7c5d0;border-bottom:1px solid #dfebef}
.learning-gradient-result strong{font-family:"Cascadia Code",Consolas,monospace;font-size:17px;color:#315c7f}
.learning-gradient-result span{font-size:12px;color:#6c8095}
.learning-expand{padding:10px 0;font-size:12px;color:#647d9a}
.learning-expand summary{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
.learning-expand[open] summary{margin-bottom:12px}
.learning-snapshot{display:flex;gap:7px 18px;flex-wrap:wrap;padding:12px 14px;border-left:3px solid #a998bd;background:#f6f2fa;color:#65587d;font-size:12px;margin-bottom:15px}
.learning-snapshot strong{color:#5d4d76}
.learning-memory-footer{display:flex;flex-direction:column;gap:7px;border-left:3px solid #b6c7db;padding:9px 13px;color:#657d97;font-size:12px;background:#f7f9fc;margin-top:15px}
.learning-memory-footer strong{font-weight:600;color:#435f82}
@media(max-width:1000px){.learning-scene{padding:15px 14px 24px}.learning-weights-grid{grid-template-columns:1fr;gap:17px}.learning-weight-triple{max-width:650px}.learning-svg{min-width:850px}.learning-section-heading h3{font-size:15px}.learning-section-heading .learning-source-chip{margin-left:35px}}
@media(max-width:600px){.learning-context{gap:6px 10px;font-size:11px}.learning-gradient-result{grid-template-columns:1fr;gap:8px}.learning-weight-triple{gap:8px}.learning-matrix{font-size:11px;padding:2px}.learning-weight-pair{grid-template-columns:1fr}.learning-section-heading{gap:8px}.learning-table td,.learning-table th{padding:8px 9px}}
</style><rect width="100%" height="100%" fill="white"/><defs><marker id="learning-arrow-17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#74839a"/></marker></defs><text x="25" y="31" class="learning-svg-title" text-anchor="start">前向 UB：阶段分时使用与单 tile 原位计算</text><text x="25" y="58" class="learning-small" text-anchor="start">每行表示一块资源的用途切换；图中的条件对应它的旧读者何时结束。</text><text x="26" y="93" class="learning-strong" text-anchor="start">① 前置 Gather 的临时 UB → Dispatch</text><g class="learning-hotspot" data-learning-node="f_route_p" tabindex="0" role="button" aria-label="按 route 排序 p"><title>按 route 排序 p</title><rect x="35" y="111" width="310" height="86" rx="12" class="learning-fill-blue"/><text x="49" y="139" class="learning-strong" text-anchor="start">按 route 排序 p</text><text x="49" y="164" class="learning-small" text-anchor="start">临时源窗、索引和结果 batch</text><text x="49" y="184" class="learning-small" text-anchor="start">BF16 / FP32 按原类型搬运</text></g><g class="learning-hotspot" data-learning-node="f_route_p" tabindex="0" role="button" aria-label="完成写回，释放临时区"><title>完成写回，释放临时区</title><rect x="415" y="111" width="290" height="86" rx="12" class="learning-fill-violet"/><text x="429" y="139" class="learning-strong" text-anchor="start">完成写回，释放临时区</text><text x="429" y="164" class="learning-small" text-anchor="start">Gather 内部搬运全部结束</text><text x="429" y="184" class="learning-small" text-anchor="start">随后退出该阶段的分配</text></g><path d="M345 154 H410" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><g class="learning-hotspot" data-learning-node="f_dispatch_x" tabindex="0" role="button" aria-label="为 Dispatch 分配 UB"><title>为 Dispatch 分配 UB</title><rect x="770" y="111" width="300" height="86" rx="12" class="learning-fill-teal"/><text x="784" y="139" class="learning-strong" text-anchor="start">为 Dispatch 分配 UB</text><text x="784" y="164" class="learning-small" text-anchor="start">继续使用可用片上空间</text><text x="784" y="184" class="learning-small" text-anchor="start">接收和转发 X / p</text></g><path d="M705 154 H765" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><text x="36" y="223" class="learning-small" text-anchor="start">适用：命中前置 Gather 优化的所有保存模式；回退路径直接使用后续搬运缓冲。</text><text x="26" y="286" class="learning-strong" text-anchor="start">② AIV0 内部：Gate UB → Hp UB（UB / GM 两条交接路径共用）</text><g class="learning-hotspot" data-learning-node="m_fwd_ub" tabindex="0" role="button" aria-label="原始 Gate / Up 已到 UB"><title>原始 Gate / Up 已到 UB</title><rect x="35" y="304" width="310" height="86" rx="12" class="learning-fill-blue"/><text x="49" y="332" class="learning-strong" text-anchor="start">原始 Gate / Up 已到 UB</text><text x="49" y="357" class="learning-small" text-anchor="start">UB 路径由配对 AIC 写入</text><text x="49" y="377" class="learning-small" text-anchor="start">GM 路径从原始 GM 载入</text></g><g class="learning-hotspot" data-learning-node="m_fwd_ub" tabindex="0" role="button" aria-label="Gate 区原位改成 Hp"><title>Gate 区原位改成 Hp</title><rect x="415" y="304" width="290" height="86" rx="12" class="learning-fill-violet"/><text x="429" y="332" class="learning-strong" text-anchor="start">Gate 区原位改成 Hp</text><text x="429" y="357" class="learning-small" text-anchor="start">先结束原始激活的保存读取</text><text x="429" y="377" class="learning-small" text-anchor="start">Gate / Up 载入 FP32 寄存器</text></g><path d="M345 347 H410" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><g class="learning-hotspot" data-learning-node="m_fwd_ub" tabindex="0" role="button" aria-label="写 Hp 到 GM 后回收"><title>写 Hp 到 GM 后回收</title><rect x="770" y="304" width="300" height="86" rx="12" class="learning-fill-teal"/><text x="784" y="332" class="learning-strong" text-anchor="start">写 Hp 到 GM 后回收</text><text x="784" y="357" class="learning-small" text-anchor="start">等搬运读者结束</text><text x="784" y="377" class="learning-small" text-anchor="start">再允许下一任务使用本地 UB</text></g><path d="M705 347 H765" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><text x="36" y="416" class="learning-small" text-anchor="start">UB 交接：归还配对 AIC，下一任务重写 Gate / Up；GM 交接：下一次载入复用本地缓冲。</text><text x="36" y="438" class="learning-small" text-anchor="start">保存：none 跳过；UB+bf16 等原始值复制读完，GM+bf16 已由 AIC 直写保存区。</text><text x="36" y="460" class="learning-small" text-anchor="start">mxfp8 等量化读取原始值完成，私有压缩输出写 GM 可与激活计算重叠。</text><text x="36" y="482" class="learning-small" text-anchor="start">本例 M192×F256：Gate、Up 两片各 96KiB；Hp 在 Gate 那片内生成。</text><text x="26" y="525" class="learning-strong" text-anchor="start">③ AIV1：Dispatch staging → GMM2 双输出槽</text><g class="learning-hotspot" data-learning-node="m_ub_handoff" tabindex="0" role="button" aria-label="Dispatch 搬运 X / p"><title>Dispatch 搬运 X / p</title><rect x="35" y="543" width="310" height="86" rx="12" class="learning-fill-blue"/><text x="49" y="571" class="learning-strong" text-anchor="start">Dispatch 搬运 X / p</text><text x="49" y="596" class="learning-small" text-anchor="start">该 AIV1 使用临时搬运区</text><text x="49" y="616" class="learning-small" text-anchor="start">阶段内按依赖重复填充</text></g><g class="learning-hotspot" data-learning-node="m_ub_handoff" tabindex="0" role="button" aria-label="搬运完成，释放 UB"><title>搬运完成，释放 UB</title><rect x="415" y="543" width="290" height="86" rx="12" class="learning-fill-violet"/><text x="429" y="571" class="learning-strong" text-anchor="start">搬运完成，释放 UB</text><text x="429" y="596" class="learning-small" text-anchor="start">排空本核流水并释放分配</text><text x="429" y="616" class="learning-small" text-anchor="start">向配对 AIC 发布 UB 就绪</text></g><path d="M345 586 H410" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><g class="learning-hotspot" data-learning-node="f_gmm2_wait" tabindex="0" role="button" aria-label="GMM2 接管该 UB"><title>GMM2 接管该 UB</title><rect x="770" y="543" width="300" height="86" rx="12" class="learning-fill-teal"/><text x="784" y="571" class="learning-strong" text-anchor="start">GMM2 接管该 UB</text><text x="784" y="596" class="learning-small" text-anchor="start">数值输入另等本专家 Hp 完成</text><text x="784" y="616" class="learning-small" text-anchor="start">两个条件齐备才写输出</text></g><path d="M705 586 H765" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><text x="36" y="655" class="learning-small" text-anchor="start">适用：UB / GM 交接及所有保存模式；UB 释放保护空间，Hp 完成保护计算输入。</text><text x="26" y="718" class="learning-strong" text-anchor="start">④ GMM2 槽位：tile0 → Combine 发送 → tile2</text><g class="learning-hotspot" data-learning-node="f_gmm2" tabindex="0" role="button" aria-label="槽0保存输出 tile0"><title>槽0保存输出 tile0</title><rect x="35" y="736" width="310" height="86" rx="12" class="learning-fill-blue"/><text x="49" y="764" class="learning-strong" text-anchor="start">槽0保存输出 tile0</text><text x="49" y="789" class="learning-small" text-anchor="start">128×256 BF16，即 64KiB</text><text x="49" y="809" class="learning-small" text-anchor="start">槽1可同时计算 tile1</text></g><g class="learning-hotspot" data-learning-node="f_combine" tabindex="0" role="button" aria-label="AIV1 发送槽0内容"><title>AIV1 发送槽0内容</title><rect x="415" y="736" width="290" height="86" rx="12" class="learning-fill-violet"/><text x="429" y="764" class="learning-strong" text-anchor="start">AIV1 发送槽0内容</text><text x="429" y="789" class="learning-small" text-anchor="start">按 source 行段回传</text><text x="429" y="809" class="learning-small" text-anchor="start">发送结束后归还槽0</text></g><path d="M345 779 H410" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><g class="learning-hotspot" data-learning-node="f_gmm2" tabindex="0" role="button" aria-label="同一槽0写入 tile2"><title>同一槽0写入 tile2</title><rect x="770" y="736" width="300" height="86" rx="12" class="learning-fill-teal"/><text x="784" y="764" class="learning-strong" text-anchor="start">同一槽0写入 tile2</text><text x="784" y="789" class="learning-small" text-anchor="start">AIC 先等槽0归还</text><text x="784" y="809" class="learning-small" text-anchor="start">再覆盖上一份输出</text></g><path d="M705 779 H765" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-17)"/><text x="36" y="848" class="learning-small" text-anchor="start">适用：所有保存模式。槽0与槽1独立回收；这两个槽不同于 AIV0 的 Gate / Up 输入片。</text></svg>
