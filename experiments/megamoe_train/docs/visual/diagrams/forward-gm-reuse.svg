<svg width="1100" height="578" style="width:1100px;height:578px;min-width:0;max-width:none" class="learning-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 578" role="img" aria-label="前向GM复用：bf16独立Hp与none mxfp8原始Gate转Hp"><style>/* Copyright (c) 2026, Lu Lu
 * Modified by xixing 2026
 */

/* These rules style only the three learning scenes, not the existing graphs. */
.learning-scene{max-width:1220px;margin:0 auto;padding:20px 22px 30px;color:#263750;line-height:1.65}
[hidden]{display:none!important}
.learning-context{display:flex;align-items:center;gap:9px 18px;flex-wrap:wrap;padding:10px 13px;border-left:3px solid #4269a6;background:#eef4fc;border-radius:0 7px 7px 0;font-size:12px;color:#4d6587}
.learning-context strong{font-size:13px;color:#2f5182}
.learning-caption{font-size:12px;color:#6f7d90;line-height:1.75;margin:9px 0 16px}
.learning-routing-note{padding-bottom:12px;border-bottom:1px solid #e1e7ef}
.learning-lead{font-size:14px;color:#3c526e;margin:9px 0 14px}
.learning-section-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 13px}
.learning-section-heading h3{font-size:17px;font-weight:650;line-height:1.5;margin:0;color:#2b3f5b}
.learning-section-number{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#eaf0fa;color:#315b99;font-size:12px;font-weight:700;flex:none}
.learning-source-chip{border:0;border-bottom:1px dotted #9ab0cc;border-radius:0;background:none;padding:2px 0;color:#476c9b;cursor:pointer;font:inherit;font-size:11px;white-space:normal;text-align:left;line-height:1.5}
.learning-section-heading .learning-source-chip{margin-left:auto}
.learning-source-chip:hover{color:#214f8c;border-bottom-color:#214f8c;background:none}
.learning-source-chip:focus-visible{outline:2px solid #7fa8de;outline-offset:4px}
.learning-diagram{overflow-x:auto;margin:13px 0 9px;border:1px solid #e2e8f0;border-radius:9px;background:#fff}
.learning-svg{width:100%;height:auto;display:block;min-width:780px;color:#304764}
.learning-svg text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;fill:#405773;font-size:15px}
.learning-svg .learning-svg-title{font-size:19px;font-weight:650;fill:#2c435f}
.learning-svg .learning-strong{font-size:18px;font-weight:650;fill:#2d4868}
.learning-svg .learning-medium{font-size:16px;font-weight:550}
.learning-svg .learning-small{font-size:14px;fill:#627791}
.learning-svg .learning-tiny{font-size:12px;fill:#6e8097}
.learning-svg .learning-code{font-family:"Cascadia Code",Consolas,monospace;font-size:15px;fill:#34516e}
.learning-fill-blue{fill:#edf3fc;stroke:#a9bedb;stroke-width:1.25}
.learning-fill-teal{fill:#edf8f5;stroke:#9dc8bd;stroke-width:1.25}
.learning-fill-orange{fill:#fff5eb;stroke:#d7b798;stroke-width:1.25}
.learning-fill-violet{fill:#f3eef9;stroke:#beafd0;stroke-width:1.25}
.learning-fill-neutral{fill:#f3f5f8;stroke:#c6cdd7;stroke-width:1.25;stroke-dasharray:5 3}
.learning-stroke-blue{stroke:#7195c3}
.learning-stroke-teal{stroke:#6aab9b}
.learning-stroke-orange{stroke:#bb956c}
.learning-stroke-violet{stroke:#a28bb8}
.learning-arrow{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.learning-boundary{stroke:#9d80b3;stroke-width:2;stroke-dasharray:5 4;fill:none}
.learning-lane{fill:#fafbfd;stroke:#e0e6ef;stroke-width:1}
.learning-hotspot{cursor:pointer}
.learning-hotspot:hover>rect,.learning-hotspot:focus>rect{stroke:#456b9c;stroke-width:2.5}
.learning-hotspot:focus{outline:none}
[data-learning-node].selected>rect,[data-learning-node].learning-selected>rect,[data-learning-node].is-selected>rect{stroke:#2a61a7;stroke-width:3;filter:drop-shadow(0 1px 3px #315d9e24)}
button[data-learning-node].selected,button[data-learning-node].learning-selected,button[data-learning-node].is-selected{background:#eaf2ff;color:#224f87;border-bottom-color:#224f87}
.learning-table-wrap{max-width:100%;overflow-x:auto;border:1px solid #dfe6ef;border-radius:7px;background:#fff;margin:10px 0 13px}
.learning-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left;white-space:nowrap}
.learning-table th{padding:10px 12px;background:#f2f6fb;color:#526b8d;border-bottom:1px solid #dfe6ef;font-weight:600}
.learning-table td{padding:10px 12px;border-bottom:1px solid #eaf0f6;color:#405975;vertical-align:middle}
.learning-table tbody tr:last-child td{border-bottom:0}
.learning-table tbody tr:nth-child(even){background:#fbfcfe}
.learning-table strong{color:#2f5b8c;font-weight:650}
.learning-reuse-paths .learning-table{table-layout:fixed;white-space:normal;line-height:1.65}
.learning-numeric .learning-table{font-family:"Cascadia Code",Consolas,"Microsoft YaHei",monospace;font-size:11px}
.learning-numeric .learning-table th{font-family:Inter,"Microsoft YaHei",sans-serif;font-size:11px}
.learning-backward-numeric .learning-table th{white-space:pre-line}
.learning-backward-numeric .learning-table td{white-space:normal}
.learning-weights-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;margin:12px 0 18px}
.learning-weight-set{min-width:0;padding-bottom:6px;border-bottom:1px solid #dde6f0}
.learning-weight-set h4{font-size:13px;margin:0 0 10px;font-weight:650;color:#3f5877}
.learning-weight-triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.learning-weight-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.learning-matrix{width:100%;border-collapse:separate;border-spacing:3px;margin-top:7px;padding:2px 6px;border-left:2px solid #bac9dc;border-right:2px solid #bac9dc;font-family:"Cascadia Code",Consolas,monospace;font-size:12px}
.learning-matrix td{padding:4px 5px;text-align:center;background:#f2f6fb;min-width:24px;color:#355b85}
.learning-matrix th{font-size:10px;font-weight:500;color:#778aa2;padding-right:5px;text-align:left}
.learning-equation{font-size:13px;color:#536c8c;padding:13px 15px;margin:12px 0;border-left:3px solid #b5c8e0;background:#f3f7fc;overflow-wrap:anywhere}
.learning-equation strong{color:#2b568a}
.learning-gradient-result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin:13px 0 20px}
.learning-gradient-result>div{display:flex;flex-direction:column;gap:5px;padding:13px 0;border-top:2px solid #a7c5d0;border-bottom:1px solid #dfebef}
.learning-gradient-result strong{font-family:"Cascadia Code",Consolas,monospace;font-size:17px;color:#315c7f}
.learning-gradient-result span{font-size:12px;color:#6c8095}
.learning-expand{padding:10px 0;font-size:12px;color:#647d9a}
.learning-expand summary{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
.learning-expand[open] summary{margin-bottom:12px}
.learning-snapshot{display:flex;gap:7px 18px;flex-wrap:wrap;padding:12px 14px;border-left:3px solid #a998bd;background:#f6f2fa;color:#65587d;font-size:12px;margin-bottom:15px}
.learning-snapshot strong{color:#5d4d76}
.learning-memory-footer{display:flex;flex-direction:column;gap:7px;border-left:3px solid #b6c7db;padding:9px 13px;color:#657d97;font-size:12px;background:#f7f9fc;margin-top:15px}
.learning-memory-footer strong{font-weight:600;color:#435f82}
@media(max-width:1000px){.learning-scene{padding:15px 14px 24px}.learning-weights-grid{grid-template-columns:1fr;gap:17px}.learning-weight-triple{max-width:650px}.learning-svg{min-width:850px}.learning-section-heading h3{font-size:15px}.learning-section-heading .learning-source-chip{margin-left:35px}}
@media(max-width:600px){.learning-context{gap:6px 10px;font-size:11px}.learning-gradient-result{grid-template-columns:1fr;gap:8px}.learning-weight-triple{gap:8px}.learning-matrix{font-size:11px;padding:2px}.learning-weight-pair{grid-template-columns:1fr}.learning-section-heading{gap:8px}.learning-table td,.learning-table th{padding:8px 9px}}
</style><rect width="100%" height="100%" fill="white"/><defs><marker id="learning-arrow-16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#74839a"/></marker></defs><text x="25" y="31" class="learning-svg-title" text-anchor="start">前向 GM：保存模式决定原始激活放在哪里</text><text x="25" y="58" class="learning-small" text-anchor="start">K 是 hidden 维，H 是 SwiGLU 激活；C 是分配容量，Me 是当前专家的有效行数。</text><text x="25" y="102" class="learning-strong" text-anchor="start">GM 交接 + save=bf16</text><g class="learning-hotspot" data-learning-node="m_fwd_gm_alias" tabindex="0" role="button" aria-label="持久 GM：Gate / Up"><title>持久 GM：Gate / Up</title><rect x="35" y="122" width="310" height="86" rx="12" class="learning-fill-blue"/><text x="49" y="150" class="learning-strong" text-anchor="start">持久 GM：Gate / Up</text><text x="49" y="175" class="learning-small" text-anchor="start">AIC 直接写入保存区</text><text x="49" y="195" class="learning-small" text-anchor="start">两个 [C,F] BF16 平面</text></g><path d="M345 165 H410" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-16)"/><g class="learning-hotspot" data-learning-node="m_fwd_gm_alias" tabindex="0" role="button" aria-label="AIV0 读取并计算"><title>AIV0 读取并计算</title><rect x="415" y="122" width="290" height="86" rx="12" class="learning-fill-violet"/><text x="429" y="150" class="learning-strong" text-anchor="start">AIV0 读取并计算</text><text x="429" y="175" class="learning-small" text-anchor="start">等待本专家全部 AIC 写完</text><text x="429" y="195" class="learning-small" text-anchor="start">读原始 Gate / Up</text></g><path d="M705 165 H765" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-16)"/><g class="learning-hotspot" data-learning-node="m_forward_transient" tabindex="0" role="button" aria-label="独立临时 GM：Hp"><title>独立临时 GM：Hp</title><rect x="770" y="122" width="300" height="86" rx="12" class="learning-fill-teal"/><text x="784" y="150" class="learning-strong" text-anchor="start">独立临时 GM：Hp</text><text x="784" y="175" class="learning-small" text-anchor="start">Gate / Up 保留给反向</text><text x="784" y="195" class="learning-small" text-anchor="start">Hp 写到另一块 [C,F] 平面</text></g><text x="36" y="239" class="learning-small" text-anchor="start">此路径中，保存的 Gate 不与 GM Hp 同址；Hp 完成后供 GMM2 消费。</text><text x="25" y="287" class="learning-strong" text-anchor="start">GM 交接 + save=none / mxfp8</text><g class="learning-hotspot" data-learning-node="m_fwd_gm_alias" tabindex="0" role="button" aria-label="临时 GM：原始 Gate"><title>临时 GM：原始 Gate</title><rect x="35" y="310" width="310" height="86" rx="12" class="learning-fill-blue"/><text x="49" y="338" class="learning-strong" text-anchor="start">临时 GM：原始 Gate</text><text x="49" y="363" class="learning-small" text-anchor="start">AIC 暂借未来的 Hp 平面</text><text x="49" y="383" class="learning-small" text-anchor="start">原始 Gate 与 Hp 同址</text></g><path d="M345 353 H410" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-16)"/><g class="learning-hotspot" data-learning-node="m_fwd_gm_alias" tabindex="0" role="button" aria-label="AIV0 完整读入 tile"><title>AIV0 完整读入 tile</title><rect x="415" y="310" width="290" height="86" rx="12" class="learning-fill-violet"/><text x="429" y="338" class="learning-strong" text-anchor="start">AIV0 完整读入 tile</text><text x="429" y="363" class="learning-small" text-anchor="start">先等全部 AIC 写完本专家</text><text x="429" y="383" class="learning-small" text-anchor="start">再把本 tile 载入私有 UB</text></g><path d="M705 353 H765" class="learning-arrow learning-stroke-violet" marker-end="url(#learning-arrow-16)"/><g class="learning-hotspot" data-learning-node="m_fwd_gm_alias" tabindex="0" role="button" aria-label="同址改存 BF16 Hp"><title>同址改存 BF16 Hp</title><rect x="770" y="310" width="300" height="86" rx="12" class="learning-fill-teal"/><text x="784" y="338" class="learning-strong" text-anchor="start">同址改存 BF16 Hp</text><text x="784" y="363" class="learning-small" text-anchor="start">本 tile 的 Gate 已读完</text><text x="784" y="383" class="learning-small" text-anchor="start">才可覆写该 tile 的 GM</text></g><g class="learning-hotspot" data-learning-node="m_fwd_gm_alias" tabindex="0" role="button" aria-label="原始 Up 使用独立平面"><title>原始 Up 使用独立平面</title><rect x="35" y="425" width="1035" height="64" rx="12" class="learning-fill-orange"/><text x="52" y="451" class="learning-medium" text-anchor="start">原始 Up：另分配一个 [C,F] BF16 平面，读取期间保持可用。</text><text x="52" y="475" class="learning-small" text-anchor="start">none 不持久保存 Gate/Up；mxfp8 在激活前生成压缩保存值与 scale。</text></g><text x="36" y="522" class="learning-medium" text-anchor="start">用途切换有两道门：全部 AIC 写完原始激活 → 当前 AIV 完整读入本 tile → 才写 Hp。</text><text x="36" y="551" class="learning-small" text-anchor="start">示例 K7168 / save=bf16 默认走 UB 交接；上面的 GM 图展示另一种前向交接路径。</text></svg>
